    writeStr(0,'RIFF'); view.setUint32(4, 36 + buffer.length*numCh*2, true);
    writeStr(8,'WAVE'); writeStr(12,'fmt ');
    view.setUint32(16,16,true); view.setUint16(20,1,true);
    view.setUint16(22,numCh,true); view.setUint32(24,sr,true);
    view.setUint32(28, sr*numCh*2, true); view.setUint16(32, numCh*2, true);
    view.setUint16(34,16,true);
    writeStr(36,'data'); view.setUint32(40, buffer.length*numCh*2, true);
    var chans = []; for (var c=0;c<numCh;c++) chans.push(buffer.getChannelData(c));
    var offset = 44;
    for (var i=0;i<buffer.length;i++){
      for (var c2=0;c2<numCh;c2++){
        var s = Math.max(-1, Math.min(1, chans[c2][i]));
        view.setInt16(offset, s < 0 ? s*0x8000 : s*0x7FFF, true);
        offset += 2;
      }
    }
    return new Blob([view], { type:'audio/wav' });
  }

  function downloadBlob(blob, filename){
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 2000);
  }

  function pad2(n){ return (n < 10 ? '0' : '') + n; }
  function pad3(n){ return String(Math.max(0, Math.round(Number(n) || 0))).padStart(3, '0'); }
  function fileNamePrefix(dateObj){
    var d = dateObj || new Date();
    var yy = String(d.getFullYear()).slice(-2);
    var mm = pad2(d.getMonth() + 1);
    var dd = pad2(d.getDate());
    var hh = pad2(d.getHours());
    var mi = pad2(d.getMinutes());
    return yy + mm + dd + '_' + hh + mi + '_' + pad3(bpm) + 'BPM_PhraseNote';
  }
  var projectNameAuto = true;
  function updateDefaultProjectName(){
    if (!projectNameAuto) return;
    document.getElementById('projectNameInput').value = fileNamePrefix();
  }

  /* ---- Standard MIDI File (SMF format 0) writer, so keyboard tracks can be
     imported straight into a DAW as real MIDI, not just a rendered wav ---- */
  function writeVarLen(value){
    var bytes = [value & 0x7F];
    value >>= 7;
    while (value > 0){ bytes.push((value & 0x7F) | 0x80); value >>= 7; }
    return bytes.reverse();
  }
  function buildMidiFile(track, bpmUsed){
    var ppq = 480;
    var ticksPerSec = ppq * bpmUsed / 60;
    var events = [];
    track.notes.forEach(function(n){
      var noteNum = (n.midi != null) ? n.midi : Math.round(69 + 12 * Math.log2(n.freq / 440));
      events.push({ tick: Math.round(n.on * ticksPerSec), type: 1, note: noteNum });
      events.push({ tick: Math.round(n.off * ticksPerSec), type: 0, note: noteNum });
    });
    events.sort(function(a, b){ return (a.tick - b.tick) || (a.type - b.type); });

    var trackBytes = [];
    var microsPerQuarter = Math.round(60000000 / bpmUsed);
    trackBytes.push(0x00, 0xFF, 0x51, 0x03,
      (microsPerQuarter >> 16) & 0xFF, (microsPerQuarter >> 8) & 0xFF, microsPerQuarter & 0xFF);

    var lastTick = 0;
    events.forEach(function(ev){
      var delta = Math.max(0, ev.tick - lastTick);
      trackBytes.push.apply(trackBytes, writeVarLen(delta));
      if (ev.type === 1) trackBytes.push(0x90, ev.note, 0x64);
      else trackBytes.push(0x80, ev.note, 0x40);
      lastTick = ev.tick;
    });
    trackBytes.push(0x00, 0xFF, 0x2F, 0x00);

    var header = [0x4D,0x54,0x68,0x64, 0,0,0,6, 0,0, 0,1, (ppq >> 8) & 0xFF, ppq & 0xFF];
    var len = trackBytes.length;
    var trackHeader = [0x4D,0x54,0x72,0x6B, (len>>>24)&0xFF, (len>>>16)&0xFF, (len>>>8)&0xFF, len&0xFF];
    var all = header.concat(trackHeader, trackBytes);
    return new Blob([new Uint8Array(all)], { type: 'audio/midi' });
  }

  /* 트랙의 모든 클립을 타임라인 0초 기준으로 한 파일 분량에 합침 (클립 사이 공백은 무음) */
  function trackAudioFull(t){
    initAudio();
    var sr = t.clips[0].buffer.sampleRate, nch = 1, total = 0;
    t.clips.forEach(function(c){
      if (c.buffer.numberOfChannels > nch) nch = c.buffer.numberOfChannels;
      var e = Math.round(c.offset * sr) + c.buffer.length;
      if (e > total) total = e;
    });
    var out = audioCtx.createBuffer(nch, total, sr);
    t.clips.forEach(function(c){
      var start = Math.round(c.offset * sr);
      for (var ch = 0; ch < nch; ch++){
        out.getChannelData(ch).set(c.buffer.getChannelData(Math.min(ch, c.buffer.numberOfChannels - 1)), start);
      }
    });
    return out;
  }
  function trackMidiAbs(t){
    var notes = [];
    t.clips.forEach(function(c){
      c.notes.forEach(function(n){ notes.push({ freq:n.freq, midi:n.midi, on:n.on + c.offset, off:n.off + c.offset }); });
    });
    notes.sort(function(a, b){ return a.on - b.on; });
    return { notes: notes };
  }

  function trackNum(t){ return String(t.id).padStart(2, '0'); }
  function trackExportBlob(t){
    return t.type === 'audio'
      ? audioBufferToWav(trackAudioFull(t))
      : buildMidiFile(trackMidiAbs(t), bpm);
  }
  function exportTrack(t){
    if (!t.clips.length) return;
    downloadBlob(trackExportBlob(t), projectFilePrefix(0, t));
  }

  /* 선택된 트랙들을 타임라인 위치 그대로 한 파일로 합침 (뮤트된 트랙은 제외) */
  function renderMixBlob(list){
    var maxEnd = 0;
    list.forEach(function(t){ var e = trackEnd(t); if (e > maxEnd) maxEnd = e; });
    if (maxEnd <= 0) return Promise.resolve(null);
    var sr = audioCtx ? audioCtx.sampleRate : 44100;
    var offline = new OfflineAudioContext(2, Math.ceil((maxEnd + 0.4) * sr), sr);
    var mg = offline.createGain(); mg.gain.value = 1; mg.connect(offline.destination);
    list.forEach(function(t){
      if (!trackAudible(t)) return;
      var g = offline.createGain(); g.gain.value = t.volume; g.connect(mg);
      t.clips.forEach(function(c){
        if (t.type === 'audio'){
          var src = offline.createBufferSource(); src.buffer = c.buffer;
          src.connect(g); src.start(c.offset);
        } else {
          c.notes.forEach(function(n){ playEP(offline, n.freq, c.offset + n.on, Math.max(0.05, n.off - n.on), g, 1); });
        }
      });
    });
    return offline.startRendering().then(function(rendered){ return audioBufferToWav(rendered); });
  }

  /* ============ project save ============ */
  function sanitizeFileName(name){
    return String(name || '').trim().replace(/[\\/:*?"<>|]/g, '_').replace(/\s+/g, ' ').slice(0, 80) || '새 프로젝트';
  }
  function projectBase(){
    return sanitizeFileName(document.getElementById('projectNameInput').value || fileNamePrefix());
  }
  /* 같은 종류끼리 1,2,3… 번호를 매겨 Audio1 / MIDI2 처럼 구분 */
  function trackLabel(track){
    var same = tracks.filter(function(x){ return x.type === track.type; });
    var n = same.indexOf(track) + 1;
    if (n < 1) n = 1;
    return (track.type === 'audio' ? 'Audio' : 'MIDI') + n;
  }
  function projectFilePrefix(index, track){
    return projectBase() + '_' + trackLabel(track) + (track.type === 'audio' ? '.wav' : '.mid');
  }
  function downloadFiles(files){
    files.forEach(function(f, i){ setTimeout(function(){ downloadBlob(f.blob, f.name); }, i * 500); });
  }

  async function saveProject(){
    var selectedTracks = tracks.filter(function(t){ return t.clips.length > 0 && t.selected !== false; });
    if (selectedTracks.length === 0){ alert('저장할 트랙이 없어요. 트랙을 체크하거나 먼저 녹음해주세요.'); return; }
    var status = document.getElementById('projectStatus');
    var projectName = projectBase();
    document.getElementById('projectNameInput').value = projectName;

    var files = selectedTracks.map(function(t, i){ return { name: projectFilePrefix(i, t), blob: trackExportBlob(t) }; });
    if (document.getElementById('mixToggle').checked && selectedTracks.length > 1){
      status.textContent = '믹스 파일 만드는 중…';
      try {
        var mixBlob = await renderMixBlob(selectedTracks);
        if (mixBlob) files.push({ name: projectName + '_Mix.wav', blob: mixBlob });
      } catch(e){ console.warn('믹스 실패:', e); }
    }
    downloadFiles(files);
    status.textContent = files.length + '개 파일을 다운로드 폴더에 저장했어요. (' + projectName + '_…)';
  }

  /* ============ 작업 자동 보관 (브라우저 내부 IndexedDB) ============
     녹음이 끝날 때마다 트랙을 보관해두고, 탭이 종료됐다 다시 열려도 복구함 */
  var SESSION_DB = 'phrasenote-session', SESSION_STORE = 'kv';
  var sessionDbPromise = null;
  function openSessionDB(){
    if (sessionDbPromise) return sessionDbPromise;
    sessionDbPromise = new Promise(function(res, rej){
      var r = indexedDB.open(SESSION_DB, 1);
      r.onupgradeneeded = function(){ r.result.createObjectStore(SESSION_STORE); };
      r.onsuccess = function(){ res(r.result); };
      r.onerror = function(){ rej(r.error); };
    });
    return sessionDbPromise;
  }
  function sessionTx(mode, fn){
    return openSessionDB().then(function(db){
      return new Promise(function(res, rej){
        var tx = db.transaction(SESSION_STORE, mode);
        var out = fn(tx.objectStore(SESSION_STORE));
        tx.oncomplete = function(){ res(out && out.result !== undefined ? out.result : undefined); };
        tx.onerror = function(){ rej(tx.error); };
      });
    }).catch(function(e){ console.warn('자동 보관 오류:', e); });
  }
  function sessionPut(key, val){ return sessionTx('readwrite', function(st){ st.put(val, key); }); }
  function sessionDelete(key){ return sessionTx('readwrite', function(st){ st.delete(key); }); }
  function sessionClear(){ return sessionTx('readwrite', function(st){ st.clear(); }); }
  function clipToRecord(c){
    var rec = { id:c.id, type:c.type, offset:c.offset, duration:c.duration };
    if (c.type === 'audio'){
      rec.sampleRate = c.buffer.sampleRate;
      rec.channels = [];
      for (var ch = 0; ch < c.buffer.numberOfChannels; ch++) rec.channels.push(c.buffer.getChannelData(ch));
    } else {
      rec.notes = c.notes;
    }
    return rec;
  }
  /* 클립은 바뀌지 않으니, 한 번 보관한 클립은 다시 쓰지 않고 새로 생긴/사라진 것만 반영함 */
  var persistedClipIds = new Set(), metaSaveTimer = null;
  function saveSessionMeta(){
    clearTimeout(metaSaveTimer);
    metaSaveTimer = setTimeout(syncSessionNow, 300);
  }
  function syncSessionNow(){
    var live = new Set();
    tracks.forEach(function(t){
      t.clips.forEach(function(c){
        live.add(c.id);
        if (!persistedClipIds.has(c.id)){ persistedClipIds.add(c.id); sessionPut('clip:' + c.id, clipToRecord(c)); }
      });
    });
    Array.from(persistedClipIds).forEach(function(id){
      if (!live.has(id)){ persistedClipIds.delete(id); sessionDelete('clip:' + id); }
    });
    sessionPut('meta', {
      version:2, bpm:bpm, beatsPerBar:beatsPerBar, noteValue:noteValue,
      trackIdSeq:trackIdSeq, clipIdSeq:clipIdSeq, typeSeq:typeSeq, armedTrackId:armedTrackId,
      tracks: tracks.map(function(t){
        return { id:t.id, type:t.type, name:t.name, muted:t.muted, solo:t.solo, volume:t.volume, selected:t.selected,
                 clipIds: t.clips.map(function(c){ return c.id; }) };
      })
    });
  }
  function makeAudioBuffer(channels, sampleRate){
    var len = channels[0].length, buf;
    try { buf = new AudioBuffer({ length:len, numberOfChannels:channels.length, sampleRate:sampleRate }); }
    catch(e){ initAudio(); buf = audioCtx.createBuffer(channels.length, len, sampleRate); }
    channels.forEach(function(ch, i){ buf.getChannelData(i).set(ch); });
    return buf;
  }
  function recordToClip(r){
    var c = { id:r.id, type:r.type, offset:r.offset || 0, duration:r.duration };
    if (r.type === 'audio'){ c.buffer = makeAudioBuffer(r.channels, r.sampleRate); c.duration = c.buffer.duration; }
    else { c.notes = r.notes || []; }
    return c;
  }
  function restoreSession(){
    return openSessionDB().then(function(db){
      return new Promise(function(res){
        var tx = db.transaction(SESSION_STORE, 'readonly'), st = tx.objectStore(SESSION_STORE);
        var keysReq = st.getAllKeys(), valsReq = st.getAll();
        tx.oncomplete = function(){ res({ keys: keysReq.result || [], vals: valsReq.result || [] }); };
        tx.onerror = function(){ res({ keys:[], vals:[] }); };
      });
    }).then(function(data){
      var meta = null, clipRecs = {}, oldRecs = {};
      data.keys.forEach(function(k, i){
        var key = String(k), v = data.vals[i];
        if (key === 'meta') meta = v;
        else if (key.indexOf('clip:') === 0) clipRecs[v.id] = v;
        else if (key.indexOf('track:') === 0) oldRecs[v.id] = v;     // 예전 형식(트랙 하나 = 녹음 하나)
      });
      if (!meta) return;
      bpm = meta.bpm || bpm; beatsPerBar = meta.beatsPerBar || beatsPerBar; noteValue = meta.noteValue || noteValue;
      document.getElementById('bpmInput').value = bpm;
      document.getElementById('beatsSelect').value = String(beatsPerBar);
      document.getElementById('noteValueSelect').value = String(noteValue);

      var maxClip = 0;
      Object.keys(clipRecs).forEach(function(k){ if (+k > maxClip) maxClip = +k; });
      clipIdSeq = Math.max(meta.clipIdSeq || 1, maxClip + 1);

      var restored = [];
      (meta.tracks || []).forEach(function(m){
        var old = oldRecs[m.id];
        var t = { id:m.id, type: m.type || (old && old.type) || 'audio', name: migrateTrackName(m.name || (old && old.name) || '트랙'),
                  muted:!!m.muted, solo:!!m.solo, volume:(m.volume == null ? 1 : m.volume), selected:m.selected !== false, clips:[] };
        if (Array.isArray(m.clipIds)){
          m.clipIds.forEach(function(cid){ var r = clipRecs[cid]; if (r) t.clips.push(recordToClip(r)); });
        } else if (old){
          t.clips.push(recordToClip(Object.assign({}, old, { id: clipIdSeq++ })));   // 예전 형식 → 클립 하나로 변환
        }
        restored.push(t);
      });
      tracks = restored;
      typeSeq = Object.assign({ audio:0, midi:0 }, meta.typeSeq || {});
      ['audio', 'midi'].forEach(function(type){
        var n = tracks.filter(function(x){ return x.type === type; }).length;
        if ((typeSeq[type] || 0) < n) typeSeq[type] = n;
      });
      var maxId = 0; tracks.forEach(function(t){ if (t.id > maxId) maxId = t.id; });
      trackIdSeq = Math.max(meta.trackIdSeq || 1, maxId + 1);
      armedTrackId = meta.armedTrackId || null;
      ensureArmedValid();
      refreshDefaultZoom();
      Object.keys(oldRecs).forEach(function(id){ sessionDelete('track:' + id); });
      persistedClipIds = new Set(Object.keys(clipRecs).map(Number));
      updateDefaultProjectName();
      renderTimeline();
      updateTransportUI();
      syncSessionNow();
      var filled = tracks.filter(function(t){ return t.clips.length > 0; }).length;
      if (filled) document.getElementById('projectStatus').textContent = '이전 작업(녹음된 트랙 ' + filled + '개)을 복구했어요.';
    }).catch(function(e){ console.warn('복구 실패:', e); });
  }
  function newSession(){
    if (hasContent() && !confirm('지금 트랙을 모두 지우고 새로 시작할까요? (저장하지 않은 녹음은 사라져요)')) return;
    if (isRecording) stopRecording();
    if (isPlaying) stopAll();
    tracks = []; trackIdSeq = 1; clipIdSeq = 1; typeSeq = { audio:0, midi:0 };
    playheadSeconds = 0; armedTrackId = null; selectedClipId = null; undoStack = [];
    persistedClipIds = new Set();
    ensureDefaultSlots();
    sessionClear();
    syncSessionNow();
    projectNameAuto = true; updateDefaultProjectName();
    renderTimeline(); updateTransportUI(); updateUndoUI();
    document.getElementById('projectStatus').textContent = '새 세션을 시작했어요.';
  }

  /* ============ virtual keyboard (2 octaves, 2 rows, real-piano layout) ============ */
  var NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  var WHITE_SEMIS = [0,2,4,5,7,9,11];              // C D E F G A B within an octave
  var BLACK_SEMIS = [1,3,null,6,8,10,null];         // black key after white index i (null = none, after E and B)
  function midiToFreq(m){ return 440 * Math.pow(2, (m - 69) / 12); }
  function noteNameFromMidi(m){ return NOTE_NAMES[m % 12] + (Math.floor(m / 12) - 1); }

  /* 쿼티 키보드 → 건반. 화면의 두 줄과 같은 모양으로 배치:
     위 줄(C5~B5)  = Q W E R T Y U (흰 건반) + 2 3 5 6 7 (검은 건반)
     아래 줄(C4~B4) = Z X C V B N M (흰 건반) + S D G H J (검은 건반)
     [code, 화면에 표시할 글자] — 물리 키 위치(code)로 인식해서 한글 자판 상태에서도 같은 키가 눌려요 */
  var ROW_KEYS = [
    { 0:['KeyZ','Z'], 1:['KeyS','S'], 2:['KeyX','X'], 3:['KeyD','D'], 4:['KeyC','C'], 5:['KeyV','V'],
      6:['KeyG','G'], 7:['KeyB','B'], 8:['KeyH','H'], 9:['KeyN','N'], 10:['KeyJ','J'], 11:['KeyM','M'] },
    { 0:['KeyQ','Q'], 1:['Digit2','2'], 2:['KeyW','W'], 3:['Digit3','3'], 4:['KeyE','E'], 5:['KeyR','R'],
      6:['Digit5','5'], 7:['KeyT','T'], 8:['Digit6','6'], 9:['KeyY','Y'], 10:['Digit7','7'], 11:['KeyU','U'] }
  ];
  var keyByChar = {}, keyByCode = {};

  function buildPianoRow(rootMidi, rowIndex){
    var row = document.createElement('div');
    row.className = 'piano-row';
    var whiteRow = document.createElement('div');
    whiteRow.className = 'white-row';
    var whiteW = 100 / 7;

    WHITE_SEMIS.forEach(function(semi, i){
      var midi = rootMidi + semi;
      var name = noteNameFromMidi(midi);
      var def = { name:name, midi:midi, freq:midiToFreq(midi) };
      var d = document.createElement('div');
      d.className = 'pkey white';
      d.dataset.note = name;
      var km = ROW_KEYS[rowIndex][semi];
      d.innerHTML = (i === 0 ? '<span class="kn">' + name + '</span>' : '') + (km ? '<span class="kl">' + km[1] + '</span>' : '');
      if (km){ keyByCode[km[0]] = def; keyByChar[km[1].toLowerCase()] = def; }
      attachKeyHandlers(d, def);
      whiteRow.appendChild(d);
    });
    row.appendChild(whiteRow);

    BLACK_SEMIS.forEach(function(semi, i){
      if (semi == null) return;
      var midi = rootMidi + semi;
      var name = noteNameFromMidi(midi);
      var def = { name:name, midi:midi, freq:midiToFreq(midi) };
      var d = document.createElement('div');
      d.className = 'pkey black';
      d.dataset.note = name;
      var blackW = whiteW * 0.62;
      d.style.left = ((i + 1) * whiteW - blackW / 2) + '%';
      d.style.width = blackW + '%';
      var kmb = ROW_KEYS[rowIndex][semi];
      if (kmb){
        d.innerHTML = '<span class="kl">' + kmb[1] + '</span>';
        keyByCode[kmb[0]] = def; keyByChar[kmb[1].toLowerCase()] = def;
      }
      attachKeyHandlers(d, def);
      row.appendChild(d);
    });
    return row;
  }

  function buildPiano(){
    var wrap = document.getElementById('pianoWrap');
    wrap.innerHTML = '';
    keyByChar = {}; keyByCode = {};
    // row 1 (top, visually first) = higher octave C5–B5, row 2 (bottom) = C4–B4,
    // so on-screen top-to-bottom matches pitch high-to-low like a real keyboard laid flat.
    wrap.appendChild(buildPianoRow(72, 1));
    wrap.appendChild(buildPianoRow(60, 0));
  }

  function attachKeyHandlers(d, n){
    d.addEventListener('pointerdown', function(ev){ ev.preventDefault(); pressKey(n); });
    d.addEventListener('pointerup', function(ev){ ev.preventDefault(); releaseKey(n.name); });
    d.addEventListener('pointerleave', function(ev){ releaseKey(n.name); });
    d.addEventListener('pointercancel', function(ev){ releaseKey(n.name); });
  }

  function pressKey(n){
    if (activeNoteOns[n.name]) return;
    initAudio(); audioCtx.resume();
    var nodes = startLiveNote(n.freq);
    nodes.midi = n.midi;
    if (isRecording && recordingType === 'midi'){
      nodes.recStart = Math.max(0, audioCtx.currentTime - recordStartCtxTime - outputLatencySec());
    }
    activeNoteOns[n.name] = nodes;
    var el = document.querySelector('.pkey[data-note="' + n.name + '"]');
    if (el) el.classList.add('active');
  }
  function releaseKey(name){
    var nodes = activeNoteOns[name];
    if (!nodes) return;
    stopLiveNote(nodes);
    if (isRecording && recordingType === 'midi' && nodes.recStart != null){
      var offT = Math.max(nodes.recStart + 0.05, audioCtx.currentTime - recordStartCtxTime - outputLatencySec());
      tempMidiNotes.push({ freq: nodes.freq, midi: nodes.midi, on: nodes.recStart, off: offT });
    }
    delete activeNoteOns[name];
    var el = document.querySelector('.pkey[data-note="' + name + '"]');
    if (el) el.classList.remove('active');
  }

  function isTextEntry(el){
    if (!el) return false;
    var tag = (el.tagName || '').toLowerCase();
    if (tag === 'textarea' || tag === 'select' || el.isContentEditable) return true;
    if (tag === 'input'){
      var t = (el.type || 'text').toLowerCase();
      return ['text', 'search', 'number', 'email', 'url', 'tel', 'password'].indexOf(t) >= 0;
    }
    return false;
  }
  function lookupKey(e){ return keyByCode[e.code] || keyByChar[String(e.key || '').toLowerCase()] || null; }
  document.addEventListener('keydown', function(e){
    if (isTextEntry(e.target) || e.ctrlKey || e.metaKey || e.altKey) return;   // 프로젝트명 등을 칠 때는 소리 안 나게
    var n = lookupKey(e);
    if (n && !e.repeat) pressKey(n);
  });
  document.addEventListener('keyup', function(e){
    var n = lookupKey(e);
    if (n) releaseKey(n.name);
  });

  /* ---- 외장 MIDI 컨트롤러(USB/블루투스) 입력 ----
     화면 속 건반과 똑같이 pressKey/releaseKey를 그대로 재사용해요.
     그래서 녹음/실시간 재생/화면 하이라이트가 가상 건반이랑 동일하게 동작합니다. */
  var midiAccess = null, midiInputs = [];

  function initMidiInput(){
    if (!navigator.requestMIDIAccess) return;
    navigator.requestMIDIAccess({ sysex:false }).then(function(access){
      midiAccess = access;
      refreshMidiInputs();
      access.onstatechange = refreshMidiInputs;
    }).catch(function(err){ console.warn('MIDI 접근 실패:', err); });
  }
  function refreshMidiInputs(){
    if (!midiAccess) return;
    midiInputs = Array.from(midiAccess.inputs.values());
    midiInputs.forEach(function(inp){ inp.onmidimessage = onExternalMidiMessage; });
    var el = document.getElementById('midiDeviceLabel');
    if (!el) return;
    el.textContent = midiInputs.length === 0
      ? '외부 MIDI: 연결 안 됨'
      : '외부 MIDI: ' + midiInputs.map(function(i){ return i.name; }).join(', ');
  }
  function onExternalMidiMessage(ev){
    var data = ev.data;
    if (!data || data.length < 2) return;
    var status = data[0] & 0xf0;
    var noteNum = data[1];
    var velocity = (data[2] || 0) / 127;
    var name = noteNameFromMidi(noteNum);
    if (status === 0x90 && velocity > 0){
      pressKey({ name:name, midi:noteNum, freq:midiToFreq(noteNum) });
    } else if (status === 0x80 || (status === 0x90 && velocity === 0)){
      releaseKey(name);
    }
  }


  /* ============ transport UI ============ */
  function updateTransportUI(){
    var recA = document.getElementById('recAudioBtn');
    var recM = document.getElementById('recMidiBtn');
    var play = document.getElementById('playBtn');
    var kbRec = document.getElementById('kbRecBtn');
    var kbPlay = document.getElementById('kbPlayBtn');
    recA.classList.toggle('active', isRecording && recordingType === 'audio');
    recM.classList.toggle('active', isRecording && recordingType === 'midi');
    play.classList.toggle('active', isPlaying);
    kbRec.classList.toggle('active', isRecording && recordingType === 'midi');
    kbPlay.classList.toggle('active', isPlaying);
    recA.disabled = isRecording || isPlaying;
    recM.disabled = isRecording || isPlaying;
    play.disabled = isRecording || isPlaying || !hasContent();
    var armedT = trackById(armedTrackId);
    recA.classList.toggle('target', !!armedT && armedT.type === 'audio');
    recM.classList.toggle('target', !!armedT && armedT.type === 'midi');
    document.getElementById('rewindBtn').disabled = isRecording;
    updateMetronomeStandaloneUI();
  }

  /* ============ wiring ============ */
  document.getElementById('bpmInput').addEventListener('input', function(e){
    var v = parseInt(e.target.value, 10);
    if (!v || isRecording || isPlaying) return;
    bpm = Math.max(30, Math.min(260, v));
    updateDefaultProjectName();
    refreshDefaultZoom();
    renderTimeline();
    saveSessionMeta();
  });
  document.getElementById('beatsSelect').addEventListener('change', function(e){ beatsPerBar = parseInt(e.target.value, 10); refreshDefaultZoom(); renderTimeline(); saveSessionMeta(); });
  document.getElementById('noteValueSelect').addEventListener('change', function(e){ noteValue = parseInt(e.target.value, 10); refreshDefaultZoom(); renderTimeline(); saveSessionMeta(); });
  try { localStorage.removeItem('pn-sync-ms'); } catch(e){}   // 예전 싱크 보정값 정리
  document.getElementById('mixToggle').addEventListener('change', function(e){ document.getElementById('mixChip').classList.toggle('on', e.target.checked); });
  document.getElementById('newSessionBtn').addEventListener('click', newSession);
  document.getElementById('metronomeSoundSelect').addEventListener('change', function(e){ metronomeSound = e.target.value; });
  document.getElementById('metroToggleBtn').classList.toggle('active', metronomeDuringPlayback);
  document.getElementById('metroToggleBtn').addEventListener('click', function(){
    metronomeDuringPlayback = !metronomeDuringPlayback;
    this.classList.toggle('active', metronomeDuringPlayback);
    // 이미 예약된 클릭까지 즉시 끊기/살리기 위해 게인도 바로 조절
    if (metronomeGain) metronomeGain.gain.value = metronomeDuringPlayback ? 0.55 : 0;
  });
  document.getElementById('metronomeStandaloneBtn').addEventListener('click', function(){
    if (metronomeStandaloneRunning) stopMetronomeStandalone(); else startMetronomeStandalone();
  });
  document.getElementById('countinToggle').addEventListener('change', function(e){
    countInEnabled = e.target.checked;
    document.getElementById('countinChip').classList.toggle('on', countInEnabled);
    document.getElementById('countInBars').disabled = !countInEnabled;
    document.getElementById('countinState').textContent = countInEnabled ? '켜짐' : '꺼짐';
  });
  function applyMasterVol(v){
    v = Math.max(0, Math.min(4, v));
    if (masterGain) masterGain.gain.setTargetAtTime(v, audioCtx.currentTime, 0.02);
    document.getElementById('masterVolValue').textContent = v.toFixed(1) + 'x';
    try { localStorage.setItem('pn-master-vol', String(v)); } catch(e){}
  }
  document.getElementById('masterVol').addEventListener('input', function(e){ applyMasterVol(parseFloat(e.target.value)); });
  (function(){
    var saved = null;
    try { saved = parseFloat(localStorage.getItem('pn-master-vol')); } catch(e){}
    var v = (saved != null && !isNaN(saved)) ? saved : 1;
    document.getElementById('masterVol').value = v;
    document.getElementById('masterVolValue').textContent = v.toFixed(1) + 'x';
  })();
  document.getElementById('countinChip').classList.add('on');
  document.getElementById('countInBars').addEventListener('change', function(e){ countInBars = parseInt(e.target.value, 10) === 1 ? 1 : 2; });

  document.getElementById('recAudioBtn').addEventListener('click', function(){ startRecording('audio'); });
  document.getElementById('recMidiBtn').addEventListener('click', function(){ startRecording('midi'); });
  document.getElementById('playBtn').addEventListener('click', function(){ initAudio(); audioCtx.resume(); playAll(); });
  document.getElementById('stopBtn').addEventListener('click', function(){ if (isRecording) stopRecording(); if (isPlaying) stopAll(); });
  document.getElementById('rewindBtn').addEventListener('click', function(){ seekTo(0); });
  document.getElementById('selectAllTracksBtn').addEventListener('click', function(){ tracks.forEach(function(t){ t.selected = true; }); renderTimeline(); saveSessionMeta(); });
  document.getElementById('selectNoneTracksBtn').addEventListener('click', function(){ tracks.forEach(function(t){ t.selected = false; }); renderTimeline(); saveSessionMeta(); });
  document.getElementById('projectNameInput').addEventListener('input', function(){ projectNameAuto = false; });
  document.getElementById('projectNameInput').addEventListener('blur', function(e){
    if (!e.target.value.trim()){ projectNameAuto = true; updateDefaultProjectName(); }
  });
  document.getElementById('saveProjectBtn').addEventListener('click', saveProject);
  document.getElementById('kbRecBtn').addEventListener('click', function(){ if (isRecording) stopRecording(); else startRecording('midi'); });
  document.getElementById('kbPlayBtn').addEventListener('click', function(){ if (isPlaying) stopAll(); else playAll(); });
  document.getElementById('kbStopBtn').addEventListener('click', function(){ if (isRecording) stopRecording(); if (isPlaying) stopAll(); });
  (function(){
    var el = document.getElementById('kbVol'), saved = null;
    try { saved = parseFloat(localStorage.getItem('pn-ep-level')); } catch(e){}
    if (saved != null && !isNaN(saved)) EP_LEVEL = saved;
    el.value = EP_LEVEL;
    el.addEventListener('input', function(e){
      EP_LEVEL = Math.max(0, Math.min(1.2, parseFloat(e.target.value) || 0));
      try { localStorage.setItem('pn-ep-level', String(EP_LEVEL)); } catch(err){}
    });
  })();

  /* ---- timeline wiring ---- */
  tlScrollEl = document.getElementById('tlScroll');
  document.getElementById('zoomInBtn').addEventListener('click', function(){ setZoom(pxPerSec * 1.25); });
  document.getElementById('zoomOutBtn').addEventListener('click', function(){ setZoom(pxPerSec / 1.25); });
  document.getElementById('followToggle').addEventListener('change', function(e){
    followPlayhead = e.target.checked;
    document.getElementById('followChip').classList.toggle('on', followPlayhead);
  });
  document.getElementById('followChip').classList.add('on');
  function timelineClickToSeek(e){
    if (isRecording) return;
    var rect = document.getElementById('tlContent').getBoundingClientRect();
    var t = (e.clientX - rect.left) / pxPerSec;
    var beat = beatDuration();
    seekTo(Math.max(0, Math.round(t / beat) * beat));     // 가장 가까운 박으로 스냅
  }
  document.getElementById('tlLanes').addEventListener('click', function(e){
    if (isRecording) return;
    if (e.target.closest('.clip-del')) return;
    var clipEl = e.target.closest('.clip');
    if (clipEl){ selectClip(parseInt(clipEl.dataset.cid, 10)); return; }    // 클립을 탭하면 선택
    if (selectedClipId != null){ selectedClipId = null; refreshClipSelectionUI(); }
    timelineClickToSeek(e);                                                  // 빈 곳을 탭하면 재생헤드 이동
  });
  document.getElementById('tlRuler').addEventListener('click', function(e){
    if (selectedClipId != null){ selectedClipId = null; refreshClipSelectionUI(); }
    timelineClickToSeek(e);
  });
  document.getElementById('undoBtn').addEventListener('click', undoLast);
  document.getElementById('addAudioTrackBtn').addEventListener('click', function(){ addTrackUI('audio'); });
  document.getElementById('addMidiTrackBtn').addEventListener('click', function(){ addTrackUI('midi'); });
  tlScrollEl.addEventListener('pointerdown', tlPointerDown);
  tlScrollEl.addEventListener('pointermove', tlPointerMove, { passive:false });
  tlScrollEl.addEventListener('pointerup', tlPointerUp);
  tlScrollEl.addEventListener('pointercancel', tlPointerUp);
  tlScrollEl.addEventListener('pointerleave', tlPointerUp);
  var tlResizeTimer = null;
  function handleTlResize(){
    if (tlResizeTimer) clearTimeout(tlResizeTimer);
    tlResizeTimer = setTimeout(function(){
      refreshDefaultZoom();
      renderTimeline();
    }, 150);
  }
  window.addEventListener('resize', handleTlResize);
  window.addEventListener('orientationchange', handleTlResize);
  pxPerSec = defaultPxPerSec();

  ensureDefaultSlots();
  updateUndoUI();
  updateDefaultProjectName();
  buildPiano();
  initMidiInput();
  renderTimeline();
  updateTransportUI();
  restoreSession();
})();
</script>
</body>
</html>
