<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PhraseNote</title>
<style>
  :root{
    --bg: #e9faf5;
    --bg-2: #ccefe5;
    --panel: rgba(255,255,255,0.94);
    --panel-2: #f4fcfa;
    --line: #b8e2d8;
    --text: #24524b;
    --text-dim: #6a918a;
    --amber: #f5a33b;
    --amber-dim: #ffd49a;
    --yellow: #ffe27a;
    --rec: #ef786b;
    --blue: #3d7fd9;
    --sky: #3bb4e8;
    --radius: 24px;
    --lane-h: 44px;
    --sans: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
    --mono: 'DejaVu Sans Mono', 'SFMono-Regular', Consolas, monospace;
  }
  @media (orientation: landscape){ :root{ --lane-h: 64px; } }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; height:100%;
    background:
      radial-gradient(circle at 8% 4%, rgba(255,255,255,.78) 0 7%, transparent 8%),
      radial-gradient(circle at 92% 18%, rgba(255,255,255,.55) 0 6%, transparent 7%),
      linear-gradient(180deg, var(--bg), var(--bg-2));
    color:var(--text);
    font-family:var(--sans); overscroll-behavior:none; user-select:none;
  }
  button{ font-family:var(--sans); -webkit-user-select:none; }
  #app{ min-height:100vh; display:flex; flex-direction:column; max-width:560px; margin:0 auto; padding:10px 12px 24px; }

  /* ---------- header ---------- */
  header{ display:flex; align-items:center; justify-content:space-between; padding:0 3px 9px; border-bottom:2px solid rgba(184,226,216,.7); margin-bottom:9px; }
  header h1{ font-size:21px; letter-spacing:0.01em; margin:0; font-weight:800; color:var(--text); }
  header h1::before{ content:'♪'; display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; margin-right:6px; border-radius:50%; background:#fff; box-shadow:0 3px 10px rgba(70,150,135,.12); font-size:14px; vertical-align:2px; }
  header .tape-mark{ font-family:var(--mono); font-size:10.5px; color:var(--text-dim); background:rgba(255,255,255,.55); padding:4px 8px; border-radius:999px; }

  section{ margin-bottom:10px; }
  .panel{ background:var(--panel); border:1px solid rgba(184,226,216,.9); border-radius:22px; padding:11px; box-shadow:0 5px 14px rgba(48,117,105,.09); }
  .panel + .panel{ margin-top:6px; }
  .row{ display:flex; align-items:center; gap:8px; }
  .row + .row{ margin-top:7px; }
  .project-panel .row{ align-items:flex-end; flex-wrap:nowrap; }
  .project-panel input[type=text]{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    border-radius:14px; padding:7px 10px; font-size:14px; width:100%; min-width:0;
  }
  .project-save-btn{ flex:0 0 auto; width:auto; min-width:52px; margin:0; white-space:nowrap; border:1px solid var(--blue); background:var(--blue); color:#fff; border-radius:999px; padding:7px 12px; font-size:12.5px; font-weight:700; box-shadow:0 2px 6px rgba(48,117,105,.08); }
  .project-location-row{ margin-top:7px; display:flex; align-items:center; gap:8px; }
  .project-location{ flex:1; min-width:0; font-size:11px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .project-location-btn{ flex:0 0 auto; border:1px solid var(--line); background:var(--panel-2); color:var(--text); border-radius:999px; padding:6px 10px; font-size:11.5px; font-weight:600; white-space:nowrap; }
  .project-status{ margin-top:5px; font-size:10.5px; color:var(--text-dim); line-height:1.35; }
  .field{ display:flex; flex-direction:column; gap:4px; flex:1; }
  .field label{ font-size:11px; color:var(--text-dim); }
  select, input[type=number]{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    border-radius:14px; padding:7px 7px; font-family:var(--mono); font-size:14px; width:100%;
  }
  .timesig-widget{
    display:flex; flex-direction:row; align-items:center; gap:2px; width:auto;
    background:var(--panel-2); border:1px solid var(--line); border-radius:14px; padding:4px 6px;
  }
  .timesig-widget select.timesig-num{
    appearance:none; -webkit-appearance:none; border:none; background:transparent; width:26px;
    text-align:center; font-family:var(--mono); font-weight:800; font-size:17px; color:var(--text);
    padding:2px 0;
  }
  .timesig-slash{ font-weight:800; font-size:16px; color:var(--text-dim); }
  .bpm-readout{
    font-family:var(--mono); font-size:30px; color:var(--amber); letter-spacing:0.02em;
    line-height:1; text-shadow:0 0 12px rgba(255,159,28,0.28);
  }
  .bpm-readout small{ font-size:12px; color:var(--text-dim); margin-left:6px; }
  .toggle-chip{
    display:flex; align-items:center; gap:6px; background:var(--panel-2); border:1px solid var(--line);
    border-radius:999px; padding:6px 10px; font-size:12px; color:var(--text-dim); cursor:pointer; white-space:nowrap;
  }
  .toggle-chip.on{ color:#fff; background:var(--blue); border-color:var(--blue); font-weight:600; }
  .toggle-chip input{ display:none; }

  /* ---------- transport ---------- */
  #status-line{ font-family:var(--mono); font-size:12px; color:var(--text-dim); min-height:15px; margin-top:5px; text-align:center; }
  #status-line.live{ color:var(--rec); }
  .transport-grid{ display:flex; gap:6px; }
  .metronome-play-btn{
    flex:1; border:none; border-radius:999px; padding:14px 10px; font-size:16px; font-weight:800;
    background:var(--amber); color:#fff; box-shadow:0 4px 12px rgba(245,163,59,.35);
  }
  .metronome-play-btn.active{ background:var(--rec); box-shadow:0 4px 12px rgba(244,81,30,.35); }
  .metronome-play-btn:disabled{ opacity:.5; }
  #metronomeSoundSelect{ flex:0 0 auto; width:auto; min-width:118px; }
  .t-btn{
    flex:1; aspect-ratio:1/1; max-width:56px; border:1px solid var(--line); border-radius:13px;
    background:var(--panel-2); box-shadow:0 2px 6px rgba(48,117,105,.06);
    color:var(--text); font-size:19px; display:flex; align-items:center; justify-content:center; padding:0;
  }
  .t-btn.rec.active{ background:var(--rec); color:#fff; border-color:var(--rec); animation:pulse 1s infinite; }
  .t-btn.midi.active{ background:var(--amber); color:#fff; border-color:var(--amber); }
  .t-btn.play.active{ background:var(--blue); color:#fff; border-color:var(--blue); }
  .t-btn.metro.active{ background:rgba(59,180,232,0.28); color:var(--blue); border-color:rgba(59,180,232,0.55); }
  .t-btn:disabled{ opacity:0.35; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.55;} }
  .wide-btn{
    width:100%; margin-top:7px; border:1px solid var(--line); border-radius:18px;
    padding:9px 10px; background:var(--panel-2); color:var(--text); font-size:13px; font-weight:700;
    box-shadow:0 3px 8px rgba(48,117,105,.05);
  }
  .master-vol{ margin-top:8px; }
  #masterVol{ accent-color:var(--sky); }
  input[type=range]{ width:100%; accent-color:var(--amber); }

  /* ---------- multitrack timeline ---------- */
  #tracksTitle{ font-size:12px; color:var(--text-dim); margin:0; }
  .tl-toolbar{ display:flex; align-items:center; gap:6px; margin-bottom:7px; }
  .tl-zoom-btn{
    width:28px; height:28px; border-radius:50%; border:1px solid var(--line);
    background:var(--panel-2); color:var(--text); font-size:16px; font-weight:800;
    display:flex; align-items:center; justify-content:center; padding:0; flex:0 0 auto;
  }
  .tl-body{ display:flex; border:1px solid var(--line); border-radius:18px; overflow:hidden; background:var(--panel); box-shadow:0 4px 12px rgba(48,117,105,.06); }
  .tl-controls{ flex:0 0 84px; display:flex; flex-direction:column; border-right:1px solid var(--line); background:rgba(61,127,217,.07); }
  .tl-ruler-spacer{ height:22px; border-bottom:1px solid var(--line); }
  .tl-ctrl-row{ height:var(--lane-h); box-sizing:border-box; display:flex; flex-direction:column; justify-content:center; gap:2px; padding:3px 6px; border-bottom:1px solid var(--line); }
  .tl-row1{ display:flex; align-items:center; gap:3px; }
  .tl-row1 .name{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:10px; font-weight:700; }
  .tl-row1 .track-select-cb{ flex:0 0 auto; width:13px; height:13px; margin:0; accent-color:var(--blue); }
  .tl-ctrl-row .mini-btn{
    width:16px; height:16px; padding:0; font-size:8.5px; border-radius:50%; flex:0 0 auto;
    border:1px solid var(--line); background:var(--panel); color:var(--text-dim); display:flex; align-items:center; justify-content:center;
  }
  .tl-ctrl-row .mini-btn.on{ color:var(--amber); border-color:var(--amber); }
  .tl-ctrl-row .mini-btn.solo-on{ color:var(--blue); border-color:var(--blue); }
  .tl-ctrl-row input[type=range]{ width:100%; height:10px; margin:0; accent-color:var(--sky); }
  .tl-scroll{ flex:1; overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch; }
  .tl-content{ position:relative; }
  .tl-ruler{ display:block; border-bottom:1px solid var(--line); }
  .tl-lane{ height:var(--lane-h); box-sizing:border-box; border-bottom:1px solid var(--line); position:relative; cursor:pointer; }
  .tl-lane canvas{ display:block; position:absolute; top:0; left:0; }
  #tlPlayhead{ position:absolute; top:0; bottom:0; left:0; width:2px; background:var(--rec); z-index:5; pointer-events:none; display:block; }
  .empty-hint{ color:var(--text-dim); font-size:12.5px; text-align:center; padding:12px 10px; border:1px dashed var(--line); border-radius:20px; background:rgba(255,255,255,.4); margin-top:8px; }


  /* ---------- keyboard (inline, always visible) ---------- */
  #keyboardPanel{ padding-bottom:8px; }
  #kbTopBar{ display:flex; align-items:center; gap:6px; margin-bottom:6px; }
  .kb-icon-btn{
    flex:0 0 auto; width:30px; height:30px; border-radius:50%; border:1px solid var(--line);
    background:var(--panel-2); color:var(--text); font-size:12px; display:flex;
    align-items:center; justify-content:center; padding:0;
  }
  .kb-icon-btn.rec-toggle.active{ background:var(--rec); color:#fff; border-color:var(--rec); }
  .kb-icon-btn.play-toggle.active{ background:var(--blue); color:#fff; border-color:var(--blue); }
  .kb-status{ flex:1; text-align:center; font-family:var(--mono); font-size:11px; color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .kb-status.live{ color:var(--rec); }

  #pianoWrap{ height:150px; display:flex; flex-direction:column; gap:5px; }
  .piano-row{ position:relative; flex:1; min-height:0; }
  .white-row{ display:flex; height:100%; gap:2px; }
  .pkey{ user-select:none; font-family:var(--mono); }
  .pkey.white{
    flex:1; height:100%; border-radius:0 0 10px 10px; display:flex; align-items:flex-end;
    justify-content:center; padding-bottom:6px; font-size:10.5px; font-weight:700;
    background:#fffaf1; color:#a99a8a; border:1px solid #d9d0c4;
  }
  .pkey.black{
    position:absolute; top:0; height:58%; z-index:2; border-radius:0 0 7px 7px;
    display:flex; align-items:flex-end; justify-content:center; padding-bottom:4px;
    background:#4c5552; color:#e6f5f0; border:1px solid #3e4643; font-size:8px;
  }
  .pkey.active.white{ background:var(--amber); color:#fff; }
  .pkey.active.black{ background:var(--amber-dim); color:#4c5552; }

  footer{ text-align:center; color:var(--text-dim); font-size:10.5px; margin-top:10px; opacity:0.7; }

  /* ---------- mic permission banner ---------- */
  .mic-banner{
    background:#fff8eb; border:1px solid #f1c77d; border-radius:20px;
    padding:9px 11px; margin-bottom:9px;
  }
  .mic-banner p{ margin:0 0 7px; font-size:12.5px; color:var(--text); line-height:1.4; }
  .mic-banner-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .mic-banner-actions button{
    border:1px solid var(--amber); background:var(--amber); color:#fff; border-radius:999px;
    padding:6px 10px; font-size:12px; font-weight:600;
  }
  .mic-banner-actions button.ghost{ background:transparent; color:var(--amber-dim); border-color:var(--line); }
  #micGuideText{ margin-top:10px; font-size:12.5px; color:var(--text-dim); line-height:1.7; border-top:1px dashed var(--line); padding-top:10px; }
  #micGuideText b{ color:var(--text); }

  /* ---------- live waveform during recording ---------- */
  .live-wave-wrap{ display:none; margin-top:7px; }
  .live-wave-wrap.active{ display:block; }
  #liveWaveCanvas{ width:100%; height:48px; display:block; background:var(--panel-2); border:1px solid var(--line); border-radius:14px; }

  /* ---------- cute rounded touch ---------- */
  button, select, input{ transition:transform .12s ease, box-shadow .12s ease, background .12s ease; }
  button:active{ transform:scale(.94); }
  .project-save-btn{ border-radius:999px; }
  .project-panel{ background:rgba(255,255,255,.97); }
</style>
</head>
<body>
<div id="app">

  <header>
    <h1>PhraseNote</h1>
    <span class="tape-mark">By Min</span>
  </header>

  <section class="panel" id="metronomePanel">
    <div class="row">
      <button class="metronome-play-btn" id="metronomeStandaloneBtn">▶ 메트로놈 재생</button>
      <select id="metronomeSoundSelect">
        <option value="click" selected>클릭</option>
        <option value="wood">탁 (우드블록)</option>
        <option value="maracas">마라카스</option>
      </select>
    </div>
    <div class="master-vol">
      <label style="font-size:11px;color:var(--text-dim)">마스터 볼륨</label>
      <input type="range" id="masterVol" min="0" max="1" step="0.01" value="0.9">
    </div>
    <div id="status-line" style="display:none">대기 중</div>
  </section>

  <section class="panel">
    <div class="row">
      <div class="field" style="flex:0 0 76px;">
        <label>BPM</label>
        <input type="number" id="bpmInput" min="30" max="260" value="100">
      </div>
      <div class="field" style="flex:0 0 auto;">
        <label>박자표</label>
        <div class="timesig-widget">
          <select id="beatsSelect" class="timesig-num">
            <option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option><option>7</option><option>9</option><option>12</option>
          </select>
          <span class="timesig-slash">/</span>
          <select id="noteValueSelect" class="timesig-num">
            <option value="2">2</option><option value="4" selected>4</option><option value="8">8</option><option value="16">16</option>
          </select>
        </div>
      </div>
      <div style="flex:1"></div>
      <label class="toggle-chip" id="countinChip"><input type="checkbox" id="countinToggle" checked>카운트인</label>
    </div>
  </section>

  <div class="mic-banner" id="micBanner" style="display:none">
    <p id="micBannerText"></p>
    <div class="mic-banner-actions">
      <button id="micRetryBtn">다시 시도</button>
      <button class="ghost" id="micGuideBtn">허용 방법 보기</button>
      <button class="ghost" id="micCloseBtn">닫기</button>
    </div>
    <div id="micGuideText" style="display:none"></div>
  </div>

  <section class="panel">
    <div class="transport-grid">
      <button class="t-btn rec" id="recAudioBtn" title="오디오 녹음"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 10v1a7 7 0 0 0 14 0v-1"></path><line x1="12" y1="19" x2="12" y2="22"></line><line x1="8" y1="22" x2="16" y2="22"></line></svg></button>
      <button class="t-btn midi" id="recMidiBtn" title="건반 녹음"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"></rect><line x1="8" y1="6" x2="8" y2="14"></line><line x1="12" y1="6" x2="12" y2="14"></line><line x1="16" y1="6" x2="16" y2="14"></line></svg></button>
      <button class="t-btn play" id="playBtn" title="전체 재생">▶</button>
      <button class="t-btn" id="stopBtn" title="정지">■</button>
      <button class="t-btn" id="rewindBtn" title="처음으로">◀</button>
      <button class="t-btn metro" id="metroToggleBtn" title="재생·녹음 시 메트로놈"><svg viewBox="0 0 24 24" width="27" height="27" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8l-2-14h-4z"></path><line x1="12" y1="7" x2="15" y2="19"></line><circle cx="12" cy="4" r="1.3"></circle><line x1="12" y1="5.3" x2="12" y2="7"></line></svg></button>
    </div>
    <div class="live-wave-wrap" id="liveWaveWrap"><canvas id="liveWaveCanvas" width="500" height="60"></canvas></div>
  </section>

  <section>
    <div class="tl-toolbar">
      <p id="tracksTitle">트랙 <span style="font-weight:400;color:var(--text-dim);font-size:11px;">(빈 곳 클릭 시 재생헤드 이동)</span></p>
      <div style="flex:1"></div>
      <button class="tl-zoom-btn" id="zoomOutBtn">−</button>
      <button class="tl-zoom-btn" id="zoomInBtn">+</button>
      <label class="toggle-chip" id="followChip"><input type="checkbox" id="followToggle" checked>재생헤드 따라가기</label>
    </div>
    <div class="tl-body">
      <div class="tl-controls" id="tlControls"><div class="tl-ruler-spacer"></div></div>
      <div class="tl-scroll" id="tlScroll">
        <div class="tl-content" id="tlContent">
          <canvas class="tl-ruler" id="tlRuler"></canvas>
          <div id="tlLanes"></div>
          <div id="tlPlayhead"></div>
        </div>
      </div>
    </div>
    <div class="empty-hint" id="tlEmptyHint">아직 녹음된 트랙이 없어요.<br>오디오 또는 건반 녹음으로 첫 트랙을 만들어보세요.</div>
  </section>

  <section class="panel" id="keyboardPanel">
    <div id="kbTopBar">
      <button class="kb-icon-btn rec-toggle" id="kbRecBtn">●</button>
      <button class="kb-icon-btn play-toggle" id="kbPlayBtn">▶</button>
      <button class="kb-icon-btn" id="kbStopBtn">■</button>
      <span class="kb-status" id="kbStatus">대기 중</span>
    </div>
    <div id="pianoWrap"></div>
    <div style="font-size:10.5px;color:var(--text-dim);text-align:center;margin-top:4px;" id="midiDeviceLabel">외부 MIDI: 확인 중…</div>
  </section>

  <section class="panel project-panel">
    <p style="margin:0 0 8px;font-size:12px;color:var(--text-dim);">저장 세션</p>
    <div class="row">
      <div class="field">
        <label>프로젝트명</label>
        <input type="text" id="projectNameInput" value="" maxlength="80" placeholder="yymmdd_hhmm_000BPM_PhraseNote">
      </div>
      <button class="project-save-btn" id="saveProjectBtn">저장</button>
    </div>
    <div class="project-location-row">
      <div class="project-location" id="projectLocation">저장 위치: 미지정</div>
      <button class="project-location-btn" id="chooseProjectLocationBtn">📁 위치 설정</button>
    </div>
    <div class="row" style="margin-top:8px;">
      <button class="mini-btn" id="selectAllTracksBtn">전체 선택</button>
      <button class="mini-btn" id="selectNoneTracksBtn">전체 해제</button>
      <div style="flex:1"></div>
      <span style="font-size:11px;color:var(--text-dim);">체크된 트랙만 저장돼요</span>
    </div>
    <div id="projectStatus" class="project-status">프로젝트 저장 시 선택한 위치에 PhraseNote 폴더가 만들어집니다.</div>
  </section>

  <footer>헤드폰 사용을 권장해요 · 마이크가 메트로놈 소리를 함께 녹음할 수 있어요</footer>
</div>

<script>
(function(){
  'use strict';

  /* ============ state ============ */
  var audioCtx = null, masterGain = null, metronomeGain = null;
  var micStream = null, mediaRecorder = null, recordedChunks = [];
  var micSourceNode = null, analyser = null, liveWaveRAF = null;
  var tracks = []; var trackIdSeq = 1;
  var bpm = 100, beatsPerBar = 4, noteValue = 4;
  var countInEnabled = true, metronomeEnabled = false, metronomeSound = 'click';
  var metronomeDuringPlayback = true;
  var metronomeStandaloneRunning = false;
  var isRecording = false, recordingType = null;
  var isPlaying = false;
  var schedulerTimer = null, nextClickTime = 0, currentClickBeat = 0;
  var activeSources = [];
  var recordStartCtxTime = 0;
  var pendingRecordOffset = 0;
  var playheadSeconds = 0, playheadBaseSeconds = 0;
  var tempMidiNotes = [];
  var activeNoteOns = {};
  var playStopTimer = null;
  var projectDirectoryHandle = null;
  var projectBaseName = 'PhraseNote';
  var noiseBuffer = null;

  /* ============ audio core ============ */
  function initAudio(){
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = parseFloat(document.getElementById('masterVol').value);
    masterGain.connect(audioCtx.destination);
    metronomeGain = audioCtx.createGain();
    metronomeGain.gain.value = 0.55;
    metronomeGain.connect(audioCtx.destination);
    var len = Math.floor(audioCtx.sampleRate * 0.3);
    noiseBuffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    var data = noiseBuffer.getChannelData(0);
    for (var i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  }

  function ensureMic(){
    if (micStream) return Promise.resolve();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      showMicBanner({ name:'NotSupported' });
      return Promise.reject(new Error('unsupported'));
    }
    return navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation:false, noiseSuppression:false, autoGainControl:false }
    }).then(function(s){
      micStream = s;
      hideMicBanner();
      setupAnalyser();
    }).catch(function(e){
      showMicBanner(e);
      throw e;
    });
  }

  function setupAnalyser(){
    if (!micStream || !audioCtx) return;
    if (micSourceNode) return;
    micSourceNode = audioCtx.createMediaStreamSource(micStream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024;
    micSourceNode.connect(analyser);
  }

  /* ---------- mic permission banner ---------- */
  function showMicBanner(err){
    var banner = document.getElementById('micBanner');
    var text = document.getElementById('micBannerText');
    var name = err && err.name;
    if (name === 'NotAllowedError' || name === 'PermissionDeniedError'){
      text.textContent = '마이크 권한이 거부되어 있어요. 브라우저 설정에서 마이크 권한을 허용한 뒤 "다시 시도"를 눌러주세요.';
    } else if (name === 'NotFoundError' || name === 'DevicesNotFoundError'){
      text.textContent = '사용할 수 있는 마이크를 찾지 못했어요. 마이크 연결을 확인해주세요.';
    } else if (name === 'NotSupported'){
      text.textContent = '이 브라우저는 마이크 녹음을 지원하지 않아요. Chrome이나 Safari 최신 버전을 사용해주세요.';
    } else {
      text.textContent = '마이크에 접근할 수 없어요. 권한 설정을 확인한 뒤 다시 시도해주세요.';
    }
    banner.style.display = 'block';
  }
  function hideMicBanner(){
    document.getElementById('micBanner').style.display = 'none';
    document.getElementById('micGuideText').style.display = 'none';
  }
  document.getElementById('micRetryBtn').addEventListener('click', function(){
    ensureMic().catch(function(){});
  });
  document.getElementById('micCloseBtn').addEventListener('click', hideMicBanner);
  document.getElementById('micGuideBtn').addEventListener('click', function(){
    var g = document.getElementById('micGuideText');
    if (g.style.display === 'none'){
      g.innerHTML =
        '<b>PC 크롬/엣지</b>: 주소창 왼쪽 자물쇠(또는 정보) 아이콘 → 사이트 설정 → 마이크 → 허용 → 새로고침<br>' +
        '<b>안드로이드 크롬</b>: 주소창의 자물쇠 아이콘 → 권한 → 마이크 → 허용<br>' +
        '<b>iOS 사파리</b>: 설정 앱 → Safari → 마이크 → "확인" 또는 "허용"으로 변경, 혹은 설정 앱 → 개인정보 보호 및 보안 → 마이크에서 브라우저 허용';
      g.style.display = 'block';
    } else {
      g.style.display = 'none';
    }
  });

  /* ---------- live waveform while recording ---------- */
  function startLiveWave(){
    var wrap = document.getElementById('liveWaveWrap');
    wrap.classList.add('active');
    if (liveWaveRAF) cancelAnimationFrame(liveWaveRAF);
    liveWaveLoop();
  }
  function stopLiveWave(){
    document.getElementById('liveWaveWrap').classList.remove('active');
    if (liveWaveRAF){ cancelAnimationFrame(liveWaveRAF); liveWaveRAF = null; }
  }
  function liveWaveLoop(){
    if (!(isRecording && recordingType === 'audio' && analyser)){ liveWaveRAF = null; return; }
    var canvas = document.getElementById('liveWaveCanvas');
    var ctx = canvas.getContext('2d');
    var buf = new Uint8Array(analyser.fftSize);
    analyser.getByteTimeDomainData(buf);
    var w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    ctx.beginPath();
    var step = buf.length / w;
    for (var x = 0; x < w; x++){
      var v = (buf[Math.floor(x * step)] / 128.0) - 1;
      var y = (0.5 + v * 0.45) * h;
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = '#ef786b';
    ctx.lineWidth = 2;
    ctx.stroke();
    liveWaveRAF = requestAnimationFrame(liveWaveLoop);
  }

  function beatDuration(){ return (60 / bpm) * (4 / noteValue); }

  function scheduleClick(time, accent){
    if (metronomeSound === 'wood') scheduleWoodClick(time, accent);
    else if (metronomeSound === 'maracas') scheduleMaracasClick(time, accent);
    else scheduleBeepClick(time, accent);
  }
  function scheduleBeepClick(time, accent){
    var osc = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = accent ? 1500 : 1000;
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(0.35, time + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, time + 0.035);
    osc.connect(g); g.connect(metronomeGain);
    osc.start(time); osc.stop(time + 0.05);
  }
  function scheduleWoodClick(time, accent){
    var src = audioCtx.createBufferSource(); src.buffer = noiseBuffer;
    var filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = accent ? 2200 : 1500;
    filter.Q.value = 6;
    var g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(accent ? 0.9 : 0.6, time + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, time + 0.03);
    src.connect(filter); filter.connect(g); g.connect(metronomeGain);
    src.start(time); src.stop(time + 0.04);
  }
  function scheduleMaracasClick(time, accent){
    var src = audioCtx.createBufferSource(); src.buffer = noiseBuffer;
    var filter = audioCtx.createBiquadFilter();
    filter.type = 'highpass';
    filter.frequency.value = 4000;
    var g = audioCtx.createGain();
    var peak = accent ? 0.5 : 0.32, dur = accent ? 0.09 : 0.06;
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(peak, time + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    src.connect(filter); filter.connect(g); g.connect(metronomeGain);
    src.start(time); src.stop(time + dur + 0.02);
  }

  function schedulerTick(){
    while (nextClickTime < audioCtx.currentTime + 0.1){
      var barPos = currentClickBeat % beatsPerBar;
      if (metronomeEnabled) scheduleClick(nextClickTime, barPos === 0);
      var s = document.getElementById('status-line');
      var kbS = document.getElementById('kbStatus');
      var label = '마디 ' + (Math.floor(currentClickBeat / beatsPerBar) + 1) + ' · 박 ' + (barPos + 1);
      if (isRecording && recordStartCtxTime > nextClickTime) label = '카운트인 · ' + (beatsPerBar - barPos);
      s.textContent = (isRecording ? '녹음 중 · ' : (isPlaying ? '재생 중 · ' : (metronomeStandaloneRunning ? '' : ''))) + label;
      s.className = isRecording ? 'live' : '';
      if (kbS) { kbS.textContent = (isRecording && recordingType==='midi' ? '녹음 중 · ' : '') + label; kbS.className = (isRecording && recordingType==='midi') ? 'kb-status live' : 'kb-status'; }
      nextClickTime += beatDuration();
      currentClickBeat++;
    }
  }

  function startScheduler(startCtxTime, fromSeconds){
    var bd = beatDuration();
    fromSeconds = fromSeconds || 0;
    var beatsElapsed = fromSeconds / bd;
    currentClickBeat = Math.ceil(beatsElapsed - 1e-6);
    if (currentClickBeat < 0) currentClickBeat = 0;
    nextClickTime = startCtxTime + (currentClickBeat * bd - fromSeconds);
    if (schedulerTimer) clearInterval(schedulerTimer);
    schedulerTimer = setInterval(schedulerTick, 25);
  }
  function stopScheduler(){
    if (schedulerTimer){ clearInterval(schedulerTimer); schedulerTimer = null; }
  }

  /* ---- 메트로놈 단독 재생 (정지 상태에서 BPM/박자 감 잡기용) ---- */
  function startMetronomeStandalone(){
    initAudio(); audioCtx.resume();
    metronomeEnabled = true;
    var startTime = audioCtx.currentTime + 0.08;
    startScheduler(startTime, 0);
    metronomeStandaloneRunning = true;
    updateMetronomeStandaloneUI();
  }
  function stopMetronomeStandalone(){
    stopScheduler();
    metronomeStandaloneRunning = false;
    metronomeEnabled = false;
    document.getElementById('status-line').textContent = '대기 중';
    document.getElementById('status-line').className = '';
    updateMetronomeStandaloneUI();
  }
  function updateMetronomeStandaloneUI(){
    var btn = document.getElementById('metronomeStandaloneBtn');
    if (!btn) return;
    btn.textContent = metronomeStandaloneRunning ? '■ 메트로놈 정지' : '▶ 메트로놈 재생';
    btn.classList.toggle('active', metronomeStandaloneRunning);
    btn.disabled = isRecording || isPlaying;
  }

  /* ---- 재생헤드(커서) 위치 ---- */
  function renderPlayheadPosition(){
    var ph = document.getElementById('tlPlayhead');
    if (!ph) return;
    ph.style.transform = 'translateX(' + (playheadSeconds * pxPerSec) + 'px)';
  }
  function seekTo(seconds){
    if (isRecording) return;
    seconds = Math.max(0, seconds);
    var wasPlaying = isPlaying;
    if (wasPlaying){
      stopActiveSources();
      stopScheduler();
      stopPlayheadLoop();
      isPlaying = false;
    }
    playheadSeconds = seconds;
    renderPlayheadPosition();
    updateTransportUI();
    if (wasPlaying) playAll();
  }

  /* simple "EP" synth voice, rendered against any given AudioContext (live or offline) */
  function playEP(ctx, freq, startTime, duration, dest, velocity){
    velocity = velocity || 1;
    var o1 = ctx.createOscillator(); o1.type = 'sine'; o1.frequency.value = freq;
    var o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = freq * 2.005;
    var g2 = ctx.createGain(); g2.gain.value = 0.16 * velocity;
    var filter = ctx.createBiquadFilter(); filter.type = 'lowpass';
    filter.frequency.setValueAtTime(4200, startTime);
    filter.frequency.exponentialRampToValueAtTime(700, startTime + duration + 0.3);
    var amp = ctx.createGain();
    amp.gain.setValueAtTime(0.0001, startTime);
    amp.gain.exponentialRampToValueAtTime(0.8 * velocity, startTime + 0.006);
    amp.gain.exponentialRampToValueAtTime(0.3 * velocity, startTime + 0.28);
    amp.gain.exponentialRampToValueAtTime(0.0001, startTime + duration + 0.3);
    o1.connect(filter); o2.connect(g2); g2.connect(filter);
    filter.connect(amp); amp.connect(dest);
    var stopT = startTime + duration + 0.35;
    o1.start(startTime); o2.start(startTime);
    o1.stop(stopT); o2.stop(stopT);
  }

  /* live sustained note (for keyboard press/hold), returns handle for release */
  function startLiveNote(freq){
    var now = audioCtx.currentTime;
    var o1 = audioCtx.createOscillator(); o1.type = 'sine'; o1.frequency.value = freq;
    var o2 = audioCtx.createOscillator(); o2.type = 'sine'; o2.frequency.value = freq * 2.005;
    var g2 = audioCtx.createGain(); g2.gain.value = 0.13;
    var filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 3600;
    var amp = audioCtx.createGain();
    amp.gain.setValueAtTime(0.0001, now);
    amp.gain.exponentialRampToValueAtTime(0.75, now + 0.006);
    amp.gain.exponentialRampToValueAtTime(0.32, now + 0.25);
    o1.connect(filter); o2.connect(g2); g2.connect(filter);
    filter.connect(amp); amp.connect(masterGain);
    o1.start(now); o2.start(now);
    return { o1:o1, o2:o2, amp:amp, freq:freq, startTime:now };
  }
  function stopLiveNote(nodes){
    var now = audioCtx.currentTime;
    var cur = nodes.amp.gain.value || 0.001;
    nodes.amp.gain.cancelScheduledValues(now);
    nodes.amp.gain.setValueAtTime(cur, now);
    nodes.amp.gain.exponentialRampToValueAtTime(0.0001, now + 0.3);
    nodes.o1.stop(now + 0.32); nodes.o2.stop(now + 0.32);
  }

  function soloActive(){ return tracks.some(function(t){ return t.solo; }); }

  /* ============ recording flow ============ */
  function trackPlaybackParams(track, fromSeconds){
    var trackEnd = track.offset + track.duration;
    if (trackEnd <= fromSeconds) return null;
    if (track.offset >= fromSeconds) return { delay: track.offset - fromSeconds, bufferOffset: 0 };
    return { delay: 0, bufferOffset: fromSeconds - track.offset };
  }

  function startRecording(type){
    initAudio();
    audioCtx.resume();
    var proceed = (type === 'audio') ? ensureMic() : Promise.resolve();
    proceed.then(function(){
      recordingType = type;
      isRecording = true;
      metronomeStandaloneRunning = false;
      metronomeEnabled = metronomeDuringPlayback;
      pendingRecordOffset = playheadSeconds;
      updateTransportUI();
      if (type === 'audio') startLiveWave();

      var bd = beatDuration();
      var countInBeats = countInEnabled ? beatsPerBar : 0;
      var scheduleStart = audioCtx.currentTime + 0.15;
      startScheduler(scheduleStart, Math.max(0, pendingRecordOffset - countInBeats * bd));
      recordStartCtxTime = scheduleStart + countInBeats * bd;
      startPlayheadLoop(recordStartCtxTime, pendingRecordOffset);

      stopActiveSources();
      tracks.forEach(function(t){
        if (t.muted) return;
        if (soloActive() && !t.solo) return;
        var params = trackPlaybackParams(t, pendingRecordOffset);
        if (!params) return;
        if (t.type === 'audio'){
          var src = audioCtx.createBufferSource();
          src.buffer = t.buffer;
          var g = audioCtx.createGain(); g.gain.value = t.volume;
          src.connect(g).connect(masterGain);
          src.start(recordStartCtxTime + params.delay, params.bufferOffset);
          activeSources.push(src);
        } else {
          t.notes.forEach(function(n){
            if (n.off <= params.bufferOffset) return;
            var on = Math.max(0, n.on - params.bufferOffset);
            playEP(audioCtx, n.freq, recordStartCtxTime + params.delay + on, Math.max(0.05, n.off - n.on), masterGain, 1);
          });
        }
      });

      if (type === 'audio'){
        recordedChunks = [];
        mediaRecorder = new MediaRecorder(micStream);
        mediaRecorder.ondataavailable = function(e){ if (e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = onAudioRecordStop;
        var delayMs = Math.max(0, (recordStartCtxTime - audioCtx.currentTime) * 1000);
        setTimeout(function(){ if (isRecording && mediaRecorder && mediaRecorder.state === 'inactive') mediaRecorder.start(); }, delayMs);
      } else {
        tempMidiNotes = [];
        activeNoteOns = {};
      }
    }).catch(function(){
      isRecording = false;
      recordingType = null;
      updateTransportUI();
    });
  }

  function stopActiveSources(){
    activeSources.forEach(function(s){ try{ s.stop(); }catch(e){} });
    activeSources = [];
  }

  function stopRecording(){
    if (!isRecording) return;
    isRecording = false;
    stopScheduler();
    stopActiveSources();
    stopPlayheadLoop();
    if (recordingType === 'audio'){
      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      stopLiveWave();
    } else if (recordingType === 'midi'){
      Object.keys(activeNoteOns).forEach(function(name){ releaseKey(name); });
      finalizeMidiTrack();
    }
    document.getElementById('status-line').textContent = '대기 중';
    document.getElementById('status-line').className = '';
    updateTransportUI();
  }

  function onAudioRecordStop(){
    var blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
    blob.arrayBuffer().then(function(buf){
      audioCtx.decodeAudioData(buf, function(buffer){
        addTrack({ type:'audio', buffer:buffer, duration:buffer.duration, offset:pendingRecordOffset, name:'오디오 ' + (tracks.length + 1) });
      }, function(err){ alert('녹음을 읽지 못했어요: ' + err); });
    });
  }

  function finalizeMidiTrack(){
    if (tempMidiNotes.length === 0) return;
    var duration = 0;
    tempMidiNotes.forEach(function(n){ if (n.off > duration) duration = n.off; });
    addTrack({ type:'midi', notes: tempMidiNotes.slice(), duration: duration, offset:pendingRecordOffset, name:'건반 ' + (tracks.length + 1) });
  }

  /* ============ playback ============ */
  function playAll(){
    if (tracks.length === 0) return;
    initAudio(); audioCtx.resume();
    var fromSeconds = playheadSeconds;
    metronomeStandaloneRunning = false;
    metronomeEnabled = metronomeDuringPlayback;
    stopAll();
    playheadSeconds = fromSeconds;
    var playStart = audioCtx.currentTime + 0.12;
    if (metronomeEnabled) startScheduler(playStart, fromSeconds);
    var maxEnd = fromSeconds;
    tracks.forEach(function(t){
      if (t.muted) return;
      if (soloActive() && !t.solo) return;
      var params = trackPlaybackParams(t, fromSeconds);
      if (!params) return;
      if (t.offset + t.duration > maxEnd) maxEnd = t.offset + t.duration;
      if (t.type === 'audio'){
        var src = audioCtx.createBufferSource(); src.buffer = t.buffer;
        var g = audioCtx.createGain(); g.gain.value = t.volume;
        src.connect(g).connect(masterGain);
        src.start(playStart + params.delay, params.bufferOffset);
        activeSources.push(src);
      } else {
        t.notes.forEach(function(n){
          if (n.off <= params.bufferOffset) return;
          var on = Math.max(0, n.on - params.bufferOffset);
          playEP(audioCtx, n.freq, playStart + params.delay + on, Math.max(0.05, n.off - n.on), masterGain, 1);
        });
      }
    });
    isPlaying = true;
    updateTransportUI();
    startPlayheadLoop(playStart, fromSeconds);
    var remaining = Math.max(0.3, maxEnd - fromSeconds);
    playStopTimer = setTimeout(function(){ stopAll(); }, (remaining + 0.6) * 1000);
  }

  function stopAll(){
    stopActiveSources();
    stopScheduler();
    stopPlayheadLoop();
    if (playStopTimer){ clearTimeout(playStopTimer); playStopTimer = null; }
    isPlaying = false;
    document.getElementById('status-line').textContent = '대기 중';
    document.getElementById('status-line').className = '';
    updateTransportUI();
  }

  /* ============ tracks state + multitrack timeline ============ */
  function addTrack(obj){
    tracks.push(Object.assign({ id:trackIdSeq++, muted:false, solo:false, volume:1, offset:0, selected:true }, obj));
    renderTimeline();
  }

  var pxPerSec = 60, userZoomed = false, followPlayhead = true;
  var tlScrollEl = null, playheadRAF = null, playheadRefTime = null;
  var pinchPointers = {}, pinchStartDist = 0, pinchStartPx = 0, pinchAnchorTime = 0, pinchAnchorClientX = 0;
  var pinchPendingPx = null, pinchRAFScheduled = false;

  function defaultPxPerSec(){
    return window.matchMedia('(orientation: landscape)').matches ? 110 : 60;
  }
  function laneHeightPx(){
    return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--lane-h')) || 44;
  }
  function sessionBarCount(){
    var barDur = beatDuration() * beatsPerBar;
    var maxDur = playheadSeconds;
    tracks.forEach(function(t){ if (t.offset + t.duration > maxDur) maxDur = t.offset + t.duration; });
    var bars = Math.ceil((maxDur + 0.001) / barDur);
    if (bars < 4) bars = 4;
    return bars + 1;
  }
  function sessionDurationSec(){ return sessionBarCount() * beatDuration() * beatsPerBar; }

  function roundRectPath(ctx, x, y, w, h, r){
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawRuler(canvas, widthCss, heightCss, dpr){
    canvas.width = Math.max(1, widthCss * dpr);
    canvas.height = Math.max(1, heightCss * dpr);
    canvas.style.width = widthCss + 'px';
    canvas.style.height = heightCss + 'px';
    var ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, widthCss, heightCss);
    var bd = beatDuration(), barDur = bd * beatsPerBar;
    var barCount = Math.ceil(widthCss / pxPerSec / barDur) + 1;
    ctx.font = "9.5px 'DejaVu Sans Mono', monospace";
    for (var b = 0; b < barCount; b++){
      var x = Math.round(b * barDur * pxPerSec) + 0.5;
      ctx.strokeStyle = 'rgba(36,82,75,0.28)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, heightCss * 0.3); ctx.lineTo(x, heightCss); ctx.stroke();
      ctx.fillStyle = 'rgba(36,82,75,0.6)';
      ctx.fillText(String(b + 1), x + 3, heightCss - 4);
      ctx.strokeStyle = 'rgba(36,82,75,0.1)';
      for (var beatI = 1; beatI < beatsPerBar; beatI++){
        var bx = Math.round((b * barDur + beatI * bd) * pxPerSec) + 0.5;
        if (bx > widthCss) break;
        ctx.beginPath(); ctx.moveTo(bx, heightCss * 0.6); ctx.lineTo(bx, heightCss); ctx.stroke();
      }
    }
  }

  function drawLaneWaveform(canvas, buffer, widthCss, heightCss, dpr){
    canvas.width = Math.max(1, widthCss * dpr);
    canvas.height = Math.max(1, heightCss * dpr);
    canvas.style.width = widthCss + 'px';
    canvas.style.height = heightCss + 'px';
    var ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, widthCss, heightCss);
    var data = buffer.getChannelData(0);
    var step = Math.max(1, Math.ceil(data.length / widthCss));
    ctx.fillStyle = '#3bb4e8';
    for (var x = 0; x < widthCss; x++){
      var min = 1, max = -1, base = x * step;
      for (var i = 0; i < step; i++){
        var idx = base + i;
        if (idx >= data.length) break;
        var v = data[idx];
        if (v < min) min = v;
        if (v > max) max = v;
      }
      var y1 = (1 + min) * 0.5 * heightCss, y2 = (1 + max) * 0.5 * heightCss;
      ctx.fillRect(x, y1, 1, Math.max(1, y2 - y1));
    }
  }

  function drawLaneMidiBlock(canvas, widthCss, heightCss, dpr){
    canvas.width = Math.max(1, widthCss * dpr);
    canvas.height = Math.max(1, heightCss * dpr);
    canvas.style.width = widthCss + 'px';
    canvas.style.height = heightCss + 'px';
    var ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, widthCss, heightCss);
    ctx.fillStyle = 'rgba(59,180,232,0.85)';
    ctx.strokeStyle = '#3bb4e8';
    ctx.lineWidth = 1;
    var barH = Math.max(4, Math.round(heightCss * 0.22));
    var y = (heightCss - barH) / 2;
    roundRectPath(ctx, 1, y, Math.max(2, widthCss - 2), barH, barH / 2);
    ctx.fill(); ctx.stroke();
  }

  function renderTimeline(){
    var emptyHint = document.getElementById('tlEmptyHint');
    var controls = document.getElementById('tlControls');
    var lanesEl = document.getElementById('tlLanes');
    var content = document.getElementById('tlContent');
    var rulerCv = document.getElementById('tlRuler');

    emptyHint.style.display = tracks.length === 0 ? 'block' : 'none';
    controls.innerHTML = '<div class="tl-ruler-spacer"></div>';
    lanesEl.innerHTML = '';

    var totalSec = sessionDurationSec();
    var widthPx = Math.max(280, Math.round(totalSec * pxPerSec));
    content.style.width = widthPx + 'px';
    var dpr = window.devicePixelRatio || 1;
    drawRuler(rulerCv, widthPx, 22, dpr);

    var laneH = laneHeightPx();

    tracks.forEach(function(t){
      var row = document.createElement('div');
      row.className = 'tl-ctrl-row';
      row.innerHTML =
        '<div class="tl-row1">' +
          '<input type="checkbox" class="track-select-cb"' + (t.selected !== false ? ' checked' : '') + '>' +
          '<span class="name">' + t.name + '</span>' +
          '<button class="mini-btn mute-btn' + (t.muted ? ' on' : '') + '">M</button>' +
          '<button class="mini-btn solo-btn' + (t.solo ? ' solo-on' : '') + '">S</button>' +
          '<button class="mini-btn dl-btn">↓</button>' +
          '<button class="mini-btn del-btn">✕</button>' +
        '</div>' +
        '<input type="range" class="vol-slider" min="0" max="1" step="0.01" value="' + t.volume + '">';
      controls.appendChild(row);
      row.querySelector('.track-select-cb').onchange = function(e){ t.selected = e.target.checked; };
      row.querySelector('.mute-btn').onclick = function(){ t.muted = !t.muted; renderTimeline(); };
      row.querySelector('.solo-btn').onclick = function(){ t.solo = !t.solo; renderTimeline(); };
      row.querySelector('.dl-btn').onclick = function(){ exportTrack(t); };
      row.querySelector('.del-btn').onclick = function(){
        if (confirm(t.name + ' 트랙을 삭제할까요?')){ tracks = tracks.filter(function(x){ return x.id !== t.id; }); renderTimeline(); }
      };
      row.querySelector('.vol-slider').oninput = function(e){ t.volume = parseFloat(e.target.value); };

      var lane = document.createElement('div');
      lane.className = 'tl-lane';
      lane.style.width = widthPx + 'px';
      var cv = document.createElement('canvas');
      cv.style.left = Math.round(t.offset * pxPerSec) + 'px';
      var laneW = Math.max(3, Math.round(t.duration * pxPerSec));
      lane.appendChild(cv);
      lanesEl.appendChild(lane);
      if (t.type === 'audio') drawLaneWaveform(cv, t.buffer, laneW, laneH, dpr);
      else drawLaneMidiBlock(cv, laneW, laneH, dpr);
    });

    renderPlayheadPosition();
  }

  /* ---- zoom (buttons + pinch) ---- */
  function setZoom(newPx, anchorClientX){
    newPx = Math.max(18, Math.min(400, newPx));
    var rect = tlScrollEl.getBoundingClientRect();
    var localX = (anchorClientX != null ? anchorClientX : rect.left + rect.width / 2) - rect.left;
    var timeAtAnchor = (tlScrollEl.scrollLeft + localX) / pxPerSec;
    pxPerSec = newPx;
    userZoomed = true;
    renderTimeline();
    tlScrollEl.scrollLeft = Math.max(0, timeAtAnchor * pxPerSec - localX);
  }

  function tlPointerDown(e){
    pinchPointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    if (Object.keys(pinchPointers).length === 2){
      var pts = Object.keys(pinchPointers).map(function(id){ return pinchPointers[id]; });
      pinchStartDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      pinchStartPx = pxPerSec;
      var midX = (pts[0].x + pts[1].x) / 2;
      var rect = tlScrollEl.getBoundingClientRect();
      pinchAnchorClientX = midX;
      pinchAnchorTime = (tlScrollEl.scrollLeft + (midX - rect.left)) / pxPerSec;
    }
  }
  function tlPointerMove(e){
    if (!(e.pointerId in pinchPointers)) return;
    pinchPointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    var ids = Object.keys(pinchPointers);
    if (ids.length === 2 && pinchStartDist > 0){
      e.preventDefault();
      var pts = ids.map(function(id){ return pinchPointers[id]; });
      var dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      var ratio = dist / pinchStartDist;
      pinchPendingPx = Math.max(18, Math.min(400, pinchStartPx * ratio));
      userZoomed = true;
      if (!pinchRAFScheduled){
        pinchRAFScheduled = true;
        requestAnimationFrame(function(){
          pinchRAFScheduled = false;
          if (pinchPendingPx != null){
            pxPerSec = pinchPendingPx;
            renderTimeline();
            var r2 = tlScrollEl.getBoundingClientRect();
            tlScrollEl.scrollLeft = Math.max(0, pinchAnchorTime * pxPerSec - (pinchAnchorClientX - r2.left));
            pinchPendingPx = null;
          }
        });
      }
    }
  }
  function tlPointerUp(e){
    delete pinchPointers[e.pointerId];
    if (Object.keys(pinchPointers).length < 2) pinchStartDist = 0;
  }

  /* ---- playhead ---- */
  function startPlayheadLoop(refTime, baseSeconds){
    playheadRefTime = refTime;
    playheadBaseSeconds = baseSeconds || 0;
    var ph = document.getElementById('tlPlayhead');
    function tick(){
      if (playheadRefTime == null) return;
      var elapsed = Math.max(0, audioCtx.currentTime - playheadRefTime);
      playheadSeconds = playheadBaseSeconds + elapsed;
      var x = playheadSeconds * pxPerSec;
      ph.style.transform = 'translateX(' + x + 'px)';
      if (followPlayhead){
        var viewW = tlScrollEl.clientWidth;
        if (x - tlScrollEl.scrollLeft > viewW * 0.85 || x < tlScrollEl.scrollLeft){
          tlScrollEl.scrollLeft = Math.max(0, x - viewW * 0.5);
        }
      }
      playheadRAF = requestAnimationFrame(tick);
    }
    tick();
  }
  function stopPlayheadLoop(){
    if (playheadRAF){ cancelAnimationFrame(playheadRAF); playheadRAF = null; }
    playheadRefTime = null;
    renderPlayheadPosition();
  }

  /* ============ WAV encode & export ============ */
  function audioBufferToWav(buffer){
    var numCh = buffer.numberOfChannels;
    var sr = buffer.sampleRate;
    var len = buffer.length * numCh * 2 + 44;
    var bufArr = new ArrayBuffer(len);
    var view = new DataView(bufArr);
    function writeStr(off, s){ for (var i=0;i<s.length;i++) view.setUint8(off+i, s.charCodeAt(i)); }
    writeStr(0,'RIFF'); view.setUint32(4, 36 + buffer.length*numCh*2, true);
    writeStr(8,'WAVE'); writeStr(12,'fmt ');
    view.setUint32(16,16,true); view.setUint16(20,1,true);
    view.setUint16(22,numCh,true); view.setUint32(24,sr,true);
    view.setUint32(28, sr*numCh*2, true); view.setUint16(32, numCh*2, true);
    view.setUint16(34,16,true);
    writeStr(36,'data'); view.setUint32(40, buffer.length*numCh*2, true);
    var chans = []; for (var c=0;c<numCh;c++) chans.push(buffer.getChannelData(c));
    var offset = 44;
    for (var i=0;i<buffer.length;i++){
      for (var c2=0;c2<numCh;c2++){
        var s = Math.max(-1, Math.min(1, chans[c2][i]));
        view.setInt16(offset, s < 0 ? s*0x8000 : s*0x7FFF, true);
        offset += 2;
      }
    }
    return new Blob([view], { type:'audio/wav' });
  }

  function downloadBlob(blob, filename){
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 2000);
  }

  function pad2(n){ return (n < 10 ? '0' : '') + n; }
  function pad3(n){ return String(Math.max(0, Math.round(Number(n) || 0))).padStart(3, '0'); }
  function fileNamePrefix(dateObj){
    var d = dateObj || new Date();
    var yy = String(d.getFullYear()).slice(-2);
    var mm = pad2(d.getMonth() + 1);
    var dd = pad2(d.getDate());
    var hh = pad2(d.getHours());
    var mi = pad2(d.getMinutes());
    return yy + mm + dd + '_' + hh + mi + '_' + pad3(bpm) + 'BPM_PhraseNote';
  }
  var projectNameAuto = true;
  function updateDefaultProjectName(){
    if (!projectNameAuto) return;
    document.getElementById('projectNameInput').value = fileNamePrefix();
  }

  /* ---- Standard MIDI File (SMF format 0) writer, so keyboard tracks can be
     imported straight into a DAW as real MIDI, not just a rendered wav ---- */
  function writeVarLen(value){
    var bytes = [value & 0x7F];
    value >>= 7;
    while (value > 0){ bytes.push((value & 0x7F) | 0x80); value >>= 7; }
    return bytes.reverse();
  }
  function buildMidiFile(track, bpmUsed){
    var ppq = 480;
    var ticksPerSec = ppq * bpmUsed / 60;
    var events = [];
    track.notes.forEach(function(n){
      var noteNum = (n.midi != null) ? n.midi : Math.round(69 + 12 * Math.log2(n.freq / 440));
      events.push({ tick: Math.round(n.on * ticksPerSec), type: 1, note: noteNum });
      events.push({ tick: Math.round(n.off * ticksPerSec), type: 0, note: noteNum });
    });
    events.sort(function(a, b){ return (a.tick - b.tick) || (a.type - b.type); });

    var trackBytes = [];
    var microsPerQuarter = Math.round(60000000 / bpmUsed);
    trackBytes.push(0x00, 0xFF, 0x51, 0x03,
      (microsPerQuarter >> 16) & 0xFF, (microsPerQuarter >> 8) & 0xFF, microsPerQuarter & 0xFF);

    var lastTick = 0;
    events.forEach(function(ev){
      var delta = Math.max(0, ev.tick - lastTick);
      trackBytes.push.apply(trackBytes, writeVarLen(delta));
      if (ev.type === 1) trackBytes.push(0x90, ev.note, 0x64);
      else trackBytes.push(0x80, ev.note, 0x40);
      lastTick = ev.tick;
    });
    trackBytes.push(0x00, 0xFF, 0x2F, 0x00);

    var header = [0x4D,0x54,0x68,0x64, 0,0,0,6, 0,0, 0,1, (ppq >> 8) & 0xFF, ppq & 0xFF];
    var len = trackBytes.length;
    var trackHeader = [0x4D,0x54,0x72,0x6B, (len>>>24)&0xFF, (len>>>16)&0xFF, (len>>>8)&0xFF, len&0xFF];
    var all = header.concat(trackHeader, trackBytes);
    return new Blob([new Uint8Array(all)], { type: 'audio/midi' });
  }

  function padAudioBufferForExport(buffer, offsetSeconds){
    if (!offsetSeconds || offsetSeconds <= 0) return buffer;
    initAudio();
    var sr = buffer.sampleRate;
    var offsetFrames = Math.round(offsetSeconds * sr);
    var padded = audioCtx.createBuffer(buffer.numberOfChannels, offsetFrames + buffer.length, sr);
    for (var c = 0; c < buffer.numberOfChannels; c++){
      padded.getChannelData(c).set(buffer.getChannelData(c), offsetFrames);
    }
    return padded;
  }
  function shiftedTrackForExport(t){
    if (!t.offset || t.type !== 'midi') return t;
    return Object.assign({}, t, {
      notes: t.notes.map(function(n){ return { freq:n.freq, midi:n.midi, on:n.on + t.offset, off:n.off + t.offset }; })
    });
  }

  function exportTrack(t){
    var name = fileNamePrefix();
    if (t.type === 'audio'){
      downloadBlob(audioBufferToWav(padAudioBufferForExport(t.buffer, t.offset)), name + '.wav');
      return;
    }
    downloadBlob(buildMidiFile(shiftedTrackForExport(t), bpm), name + '.mid');
  }

  function exportMix(){
    if (tracks.length === 0){ alert('내보낼 트랙이 없어요.'); return; }
    var maxEnd = 0;
    tracks.forEach(function(t){ if (t.offset + t.duration > maxEnd) maxEnd = t.offset + t.duration; });
    var sr = audioCtx ? audioCtx.sampleRate : 44100;
    var offline = new OfflineAudioContext(2, Math.ceil((maxEnd + 0.6) * sr), sr);
    var mg = offline.createGain(); mg.gain.value = 1; mg.connect(offline.destination);
    tracks.forEach(function(t){
      if (t.muted) return;
      if (soloActive() && !t.solo) return;
      if (t.type === 'audio'){
        var src = offline.createBufferSource(); src.buffer = t.buffer;
        var g = offline.createGain(); g.gain.value = t.volume;
        src.connect(g).connect(mg); src.start(t.offset);
      } else {
        t.notes.forEach(function(n){ playEP(offline, n.freq, t.offset + n.on, Math.max(0.05, n.off - n.on), mg, 1); });
      }
    });
    offline.startRendering().then(function(rendered){
      downloadBlob(audioBufferToWav(rendered), fileNamePrefix() + '.wav');
    });
  }

  /* ============ project save ============ */
  function sanitizeFileName(name){
    return String(name || '').trim().replace(/[\\/:*?"<>|]/g, '_').replace(/\s+/g, ' ').slice(0, 80) || '새 프로젝트';
  }
  function projectFilePrefix(index, track){
    var type = track.type === 'audio' ? 'wav' : 'mid';
    var num = String(index + 1).padStart(2, '0');
    var base = sanitizeFileName(document.getElementById('projectNameInput').value || fileNamePrefix());
    return base + '_' + num + '.' + type;
  }
  function buildProjectMeta(projectName){
    return JSON.stringify({
      format: 'PhraseNote Project',
      version: 1,
      projectName: projectName,
      bpm: bpm,
      beatsPerBar: beatsPerBar,
      noteValue: noteValue,
      createdAt: new Date().toISOString(),
      tracks: tracks.map(function(t, i){
        return { index:i + 1, name:t.name, type:t.type, duration:t.duration, volume:t.volume, muted:t.muted, solo:t.solo, file:projectFilePrefix(i,t) };
      })
    }, null, 2);
  }
  function isAndroidBridge(){ return typeof window.AndroidBridge !== 'undefined' && window.AndroidBridge !== null; }

  /* ---- 저장 위치 기억하기 (IndexedDB에 FileSystemDirectoryHandle 저장) ----
     세션이 바뀌어도 폴더를 통째로 다시 고를 필요는 없어짐. 다만 브라우저 보안 정책상
     권한(permission) 자체는 세션 간 자동 유지가 안 돼서, 저장 버튼을 누르는 순간(=사용자 제스처)에
     한 번 재확인(request) 하도록 처리함 — 그래도 폴더 선택창 전체가 다시 뜨는 것보단 훨씬 가벼움. */
  var HANDLE_DB_NAME = 'phrasenote-fs', HANDLE_STORE = 'handles', HANDLE_KEY = 'projectDir';
  function openHandleDB(){
    return new Promise(function(resolve, reject){
      var req = indexedDB.open(HANDLE_DB_NAME, 1);
      req.onupgradeneeded = function(){ req.result.createObjectStore(HANDLE_STORE); };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error); };
    });
  }
  function saveHandleToDb(handle){
    return openHandleDB().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(HANDLE_STORE, 'readwrite');
        tx.objectStore(HANDLE_STORE).put(handle, HANDLE_KEY);
        tx.oncomplete = function(){ resolve(); };
        tx.onerror = function(){ reject(tx.error); };
      });
    }).catch(function(err){ console.warn('저장 위치 기억 실패:', err); });
  }
  function loadHandleFromDb(){
    return openHandleDB().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(HANDLE_STORE, 'readonly');
        var req = tx.objectStore(HANDLE_STORE).get(HANDLE_KEY);
        req.onsuccess = function(){ resolve(req.result || null); };
        req.onerror = function(){ reject(req.error); };
      });
    }).catch(function(){ return null; });
  }
  function clearHandleFromDb(){
    return openHandleDB().then(function(db){
      var tx = db.transaction(HANDLE_STORE, 'readwrite');
      tx.objectStore(HANDLE_STORE).delete(HANDLE_KEY);
    }).catch(function(){});
  }
  function ensureHandlePermission(handle){
    return handle.queryPermission({ mode:'readwrite' }).then(function(state){
      if (state === 'granted') return true;
      return handle.requestPermission({ mode:'readwrite' }).then(function(state2){
        return state2 === 'granted';
      });
    }).catch(function(){ return false; });
  }

  function updateProjectLocationText(){
    var el = document.getElementById('projectLocation');
    if (!el) return;
    if (isAndroidBridge()){
      var has = window.AndroidBridge.hasFolder();
      el.textContent = has ? ('저장 위치: ' + (window.AndroidBridge.currentFolderName() || '선택한 폴더') + ' / PhraseNote') : '저장 위치: 미지정';
      return;
    }
    if (!projectDirectoryHandle){
      el.textContent = '저장 위치: 미지정';
      return;
    }
    el.textContent = '저장 위치: ' + (projectDirectoryHandle.name || '선택한 폴더') + ' / PhraseNote';
  }
  function chooseProjectLocation(){
    if (isAndroidBridge()){
      return new Promise(function(resolve, reject){
        window.AndroidBridge_onFolderResult = function(name){
          window.AndroidBridge_onFolderResult = null;
          if (name){
            updateProjectLocationText();
            document.getElementById('projectStatus').textContent = '저장 위치가 설정되었습니다. 프로젝트 저장 시 이 위치를 사용합니다.';
            resolve();
          } else {
            var err = new Error('폴더 선택이 취소됐어요.'); err.name = 'AbortError';
            reject(err);
          }
        };
        window.AndroidBridge.chooseFolder();
      });
    }
    if (!window.showDirectoryPicker) return Promise.reject(new Error('DIRECTORY_PICKER_UNSUPPORTED'));
    return window.showDirectoryPicker({ mode:'readwrite', startIn:'downloads' }).then(function(handle){
      projectDirectoryHandle = handle;
      updateProjectLocationText();
      document.getElementById('projectStatus').textContent = '저장 위치가 설정되었습니다. 프로젝트 저장 시 이 위치를 사용합니다.';
      saveHandleToDb(handle);
    });
  }
  async function getProjectFolder(){
    if (!window.showDirectoryPicker) throw new Error('DIRECTORY_PICKER_UNSUPPORTED');
    if (!projectDirectoryHandle){
      await chooseProjectLocation();
    } else {
      var ok = await ensureHandlePermission(projectDirectoryHandle);
      if (!ok){
        projectDirectoryHandle = null;
        await clearHandleFromDb();
        await chooseProjectLocation();
      }
    }
    try {
      var phraseNoteDir = await projectDirectoryHandle.getDirectoryHandle('PhraseNote', { create:true });
      var name = sanitizeFileName(document.getElementById('projectNameInput').value);
      document.getElementById('projectNameInput').value = name;
      return await phraseNoteDir.getDirectoryHandle(name, { create:true });
    } catch (e){
      // 이전 세션에서 기억해둔 폴더 핸들이 낡아져서(디스크 상태와 어긋나서) 못 쓰는 경우.
      // 캐시를 지우고 폴더를 한 번만 다시 고르게 해서 자동 복구를 시도함.
      console.warn('저장 위치 핸들이 낡아서 다시 선택합니다:', e);
      projectDirectoryHandle = null;
      await clearHandleFromDb();
      await chooseProjectLocation();
      var phraseNoteDir2 = await projectDirectoryHandle.getDirectoryHandle('PhraseNote', { create:true });
      var name2 = sanitizeFileName(document.getElementById('projectNameInput').value);
      document.getElementById('projectNameInput').value = name2;
      return await phraseNoteDir2.getDirectoryHandle(name2, { create:true });
    }
  }
  async function writeFileToDir(dir, filename, blob){
    var handle = await dir.getFileHandle(filename, { create:true });
    var writable = await handle.createWritable();
    await writable.write(blob);
    await writable.close();
  }
  function blobToBase64(blob){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onloadend = function(){
        var result = reader.result;
        var idx = result.indexOf(',');
        resolve(idx >= 0 ? result.slice(idx + 1) : result);
      };
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }
  async function saveProject(){
    var selectedTracks = tracks.filter(function(t){ return t.selected !== false; });
    if (selectedTracks.length === 0){ alert('저장할 트랙이 없어요. 트랙을 체크하거나 먼저 녹음해주세요.'); return; }
    var status = document.getElementById('projectStatus');
    var projectName = sanitizeFileName(document.getElementById('projectNameInput').value);
    document.getElementById('projectNameInput').value = projectName;
    try {
      if (isAndroidBridge()){
        if (!window.AndroidBridge.hasFolder()){ await chooseProjectLocation(); }
        for (var i = 0; i < selectedTracks.length; i++){
          var t = selectedTracks[i];
          var blob = t.type === 'audio' ? audioBufferToWav(padAudioBufferForExport(t.buffer, t.offset)) : buildMidiFile(shiftedTrackForExport(t), bpm);
          var b64 = await blobToBase64(blob);
          var result = window.AndroidBridge.saveFile(b64, projectName + '/' + projectFilePrefix(i, t));
          if (result !== 'OK') throw new Error('네이티브 저장 실패: ' + result);
        }
        var metaBlob = new Blob([buildProjectMeta(projectName)], { type:'application/json' });
        var metaB64 = await blobToBase64(metaBlob);
        window.AndroidBridge.saveFile(metaB64, projectName + '/project.json');
        status.textContent = '저장 완료(' + selectedTracks.length + '개 트랙): Downloads/PhraseNote/' + projectName;
        return;
      }
      var dir = await getProjectFolder();
      for (var j = 0; j < selectedTracks.length; j++){
        var t2 = selectedTracks[j];
        var blob2 = t2.type === 'audio' ? audioBufferToWav(padAudioBufferForExport(t2.buffer, t2.offset)) : buildMidiFile(shiftedTrackForExport(t2), bpm);
        await writeFileToDir(dir, projectFilePrefix(j, t2), blob2);
      }
      await writeFileToDir(dir, 'project.json', new Blob([buildProjectMeta(projectName)], {type:'application/json'}));
      status.textContent = '저장 완료(' + selectedTracks.length + '개 트랙): Downloads/PhraseNote/' + projectName;
    } catch(e){
      if (e && e.name === 'AbortError') return;
      if (e && e.message === 'DIRECTORY_PICKER_UNSUPPORTED'){
        status.textContent = '이 브라우저에서는 폴더 직접 저장을 지원하지 않아요. Chrome/Edge PC에서 사용해주세요.';
        alert('현재 브라우저에서는 웹페이지가 Download 폴더 안에 폴더를 직접 만들 수 없습니다. Chrome/Edge의 지원 브라우저에서 "폴더 직접 저장"을 사용할 수 있어요.');
      } else {
        console.error(e);
        status.textContent = '프로젝트 저장에 실패했어요.';
        alert('프로젝트 저장에 실패했어요: ' + (e.message || e));
      }
    }
  }

  /* ============ virtual keyboard (2 octaves, 2 rows, real-piano layout) ============ */
  var NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  var WHITE_SEMIS = [0,2,4,5,7,9,11];              // C D E F G A B within an octave
  var BLACK_SEMIS = [1,3,null,6,8,10,null];         // black key after white index i (null = none, after E and B)
  function midiToFreq(m){ return 440 * Math.pow(2, (m - 69) / 12); }
  function noteNameFromMidi(m){ return NOTE_NAMES[m % 12] + (Math.floor(m / 12) - 1); }

  var ROW_KEYMAP = ['a','w','s','e','d','f','t','g','y','h','u','j']; // row 1 (lower octave) computer-key hints only
  var keyByChar = {};

  function buildPianoRow(rootMidi, rowIndex){
    var row = document.createElement('div');
    row.className = 'piano-row';
    var whiteRow = document.createElement('div');
    whiteRow.className = 'white-row';
    var whiteW = 100 / 7;

    WHITE_SEMIS.forEach(function(semi, i){
      var midi = rootMidi + semi;
      var name = noteNameFromMidi(midi);
      var def = { name:name, midi:midi, freq:midiToFreq(midi) };
      var d = document.createElement('div');
      d.className = 'pkey white';
      d.dataset.note = name;
      d.textContent = (i === 0) ? name : ''; // label only the C of each row for orientation
      if (rowIndex === 0){ var k = ROW_KEYMAP[i]; if (k){ keyByChar[k] = def; } }
      attachKeyHandlers(d, def);
      whiteRow.appendChild(d);
    });
    row.appendChild(whiteRow);

    BLACK_SEMIS.forEach(function(semi, i){
      if (semi == null) return;
      var midi = rootMidi + semi;
      var name = noteNameFromMidi(midi);
      var def = { name:name, midi:midi, freq:midiToFreq(midi) };
      var d = document.createElement('div');
      d.className = 'pkey black';
      d.dataset.note = name;
      var blackW = whiteW * 0.62;
      d.style.left = ((i + 1) * whiteW - blackW / 2) + '%';
      d.style.width = blackW + '%';
      attachKeyHandlers(d, def);
      row.appendChild(d);
    });
    return row;
  }

  function buildPiano(){
    var wrap = document.getElementById('pianoWrap');
    wrap.innerHTML = '';
    keyByChar = {};
    // row 1 (top, visually first) = higher octave C5–B5, row 2 (bottom) = C4–B4,
    // so on-screen top-to-bottom matches pitch high-to-low like a real keyboard laid flat.
    wrap.appendChild(buildPianoRow(72, 1));
    wrap.appendChild(buildPianoRow(60, 0));
  }

  function attachKeyHandlers(d, n){
    d.addEventListener('pointerdown', function(ev){ ev.preventDefault(); pressKey(n); });
    d.addEventListener('pointerup', function(ev){ ev.preventDefault(); releaseKey(n.name); });
    d.addEventListener('pointerleave', function(ev){ releaseKey(n.name); });
    d.addEventListener('pointercancel', function(ev){ releaseKey(n.name); });
  }

  function pressKey(n){
    if (activeNoteOns[n.name]) return;
    initAudio(); audioCtx.resume();
    var nodes = startLiveNote(n.freq);
    nodes.midi = n.midi;
    if (isRecording && recordingType === 'midi'){
      nodes.recStart = Math.max(0, audioCtx.currentTime - recordStartCtxTime);
    }
    activeNoteOns[n.name] = nodes;
    var el = document.querySelector('.pkey[data-note="' + n.name + '"]');
    if (el) el.classList.add('active');
  }
  function releaseKey(name){
    var nodes = activeNoteOns[name];
    if (!nodes) return;
    stopLiveNote(nodes);
    if (isRecording && recordingType === 'midi' && nodes.recStart != null){
      var offT = Math.max(nodes.recStart + 0.05, audioCtx.currentTime - recordStartCtxTime);
      tempMidiNotes.push({ freq: nodes.freq, midi: nodes.midi, on: nodes.recStart, off: offT });
    }
    delete activeNoteOns[name];
    var el = document.querySelector('.pkey[data-note="' + name + '"]');
    if (el) el.classList.remove('active');
  }

  document.addEventListener('keydown', function(e){
    var n = keyByChar[e.key.toLowerCase()];
    if (n && !e.repeat) pressKey(n);
  });
  document.addEventListener('keyup', function(e){
    var n = keyByChar[e.key.toLowerCase()];
    if (n) releaseKey(n.name);
  });

  /* ---- 외장 MIDI 컨트롤러(USB/블루투스) 입력 ----
     화면 속 건반과 똑같이 pressKey/releaseKey를 그대로 재사용해요.
     그래서 녹음/실시간 재생/화면 하이라이트가 가상 건반이랑 동일하게 동작합니다. */
  var midiAccess = null, midiInputs = [];

  function initMidiInput(){
    if (!navigator.requestMIDIAccess) return;
    navigator.requestMIDIAccess({ sysex:false }).then(function(access){
      midiAccess = access;
      refreshMidiInputs();
      access.onstatechange = refreshMidiInputs;
    }).catch(function(err){ console.warn('MIDI 접근 실패:', err); });
  }
  function refreshMidiInputs(){
    if (!midiAccess) return;
    midiInputs = Array.from(midiAccess.inputs.values());
    midiInputs.forEach(function(inp){ inp.onmidimessage = onExternalMidiMessage; });
    var el = document.getElementById('midiDeviceLabel');
    if (!el) return;
    el.textContent = midiInputs.length === 0
      ? '외부 MIDI: 연결 안 됨'
      : '외부 MIDI: ' + midiInputs.map(function(i){ return i.name; }).join(', ');
  }
  function onExternalMidiMessage(ev){
    var data = ev.data;
    if (!data || data.length < 2) return;
    var status = data[0] & 0xf0;
    var noteNum = data[1];
    var velocity = (data[2] || 0) / 127;
    var name = noteNameFromMidi(noteNum);
    if (status === 0x90 && velocity > 0){
      pressKey({ name:name, midi:noteNum, freq:midiToFreq(noteNum) });
    } else if (status === 0x80 || (status === 0x90 && velocity === 0)){
      releaseKey(name);
    }
  }


  /* ============ transport UI ============ */
  function updateTransportUI(){
    var recA = document.getElementById('recAudioBtn');
    var recM = document.getElementById('recMidiBtn');
    var play = document.getElementById('playBtn');
    var kbRec = document.getElementById('kbRecBtn');
    var kbPlay = document.getElementById('kbPlayBtn');
    recA.classList.toggle('active', isRecording && recordingType === 'audio');
    recM.classList.toggle('active', isRecording && recordingType === 'midi');
    play.classList.toggle('active', isPlaying);
    kbRec.classList.toggle('active', isRecording && recordingType === 'midi');
    kbPlay.classList.toggle('active', isPlaying);
    recA.disabled = isRecording || isPlaying;
    recM.disabled = isRecording || isPlaying;
    play.disabled = isRecording || isPlaying || tracks.length === 0;
    document.getElementById('rewindBtn').disabled = isRecording;
    updateMetronomeStandaloneUI();
  }

  /* ============ wiring ============ */
  document.getElementById('bpmInput').addEventListener('input', function(e){
    var v = parseInt(e.target.value, 10);
    if (!v || isRecording || isPlaying) return;
    bpm = Math.max(30, Math.min(260, v));
    updateDefaultProjectName();
    renderTimeline();
  });
  document.getElementById('beatsSelect').addEventListener('change', function(e){ beatsPerBar = parseInt(e.target.value, 10); renderTimeline(); });
  document.getElementById('noteValueSelect').addEventListener('change', function(e){ noteValue = parseInt(e.target.value, 10); renderTimeline(); });
  document.getElementById('metronomeSoundSelect').addEventListener('change', function(e){ metronomeSound = e.target.value; });
  document.getElementById('metroToggleBtn').classList.toggle('active', metronomeDuringPlayback);
  document.getElementById('metroToggleBtn').addEventListener('click', function(){
    metronomeDuringPlayback = !metronomeDuringPlayback;
    this.classList.toggle('active', metronomeDuringPlayback);
  });
  document.getElementById('metronomeStandaloneBtn').addEventListener('click', function(){
    if (metronomeStandaloneRunning) stopMetronomeStandalone(); else startMetronomeStandalone();
  });
  document.getElementById('countinToggle').addEventListener('change', function(e){
    countInEnabled = e.target.checked;
    document.getElementById('countinChip').classList.toggle('on', countInEnabled);
  });
  document.getElementById('masterVol').addEventListener('input', function(e){
    if (masterGain) masterGain.gain.value = parseFloat(e.target.value);
  });
  document.getElementById('countinChip').classList.add('on');

  document.getElementById('recAudioBtn').addEventListener('click', function(){ startRecording('audio'); });
  document.getElementById('recMidiBtn').addEventListener('click', function(){ startRecording('midi'); });
  document.getElementById('playBtn').addEventListener('click', function(){ initAudio(); audioCtx.resume(); playAll(); });
  document.getElementById('stopBtn').addEventListener('click', function(){ if (isRecording) stopRecording(); if (isPlaying) stopAll(); });
  document.getElementById('rewindBtn').addEventListener('click', function(){ seekTo(0); });
  document.getElementById('selectAllTracksBtn').addEventListener('click', function(){ tracks.forEach(function(t){ t.selected = true; }); renderTimeline(); });
  document.getElementById('selectNoneTracksBtn').addEventListener('click', function(){ tracks.forEach(function(t){ t.selected = false; }); renderTimeline(); });
  document.getElementById('projectNameInput').addEventListener('input', function(){ projectNameAuto = false; });
  document.getElementById('projectNameInput').addEventListener('blur', function(e){
    if (!e.target.value.trim()){ projectNameAuto = true; updateDefaultProjectName(); }
  });
  document.getElementById('saveProjectBtn').addEventListener('click', saveProject);
  document.getElementById('chooseProjectLocationBtn').addEventListener('click', async function(){
    try {
      await chooseProjectLocation();
    } catch(e){
      if (e && e.name === 'AbortError') return;
      if (e && e.message === 'DIRECTORY_PICKER_UNSUPPORTED'){
        document.getElementById('projectStatus').textContent = '이 브라우저에서는 폴더 직접 저장을 지원하지 않아요. Chrome/Edge PC에서 사용해주세요.';
        alert('현재 브라우저에서는 저장 위치를 직접 선택할 수 없습니다. Chrome/Edge PC의 지원 브라우저에서 사용해주세요.');
      } else {
        console.error(e);
        alert('저장 위치 설정에 실패했어요: ' + (e.message || e));
      }
    }
  });
  document.getElementById('kbRecBtn').addEventListener('click', function(){ if (isRecording) stopRecording(); else startRecording('midi'); });
  document.getElementById('kbPlayBtn').addEventListener('click', function(){ if (isPlaying) stopAll(); else playAll(); });
  document.getElementById('kbStopBtn').addEventListener('click', function(){ if (isRecording) stopRecording(); if (isPlaying) stopAll(); });

  /* ---- timeline wiring ---- */
  tlScrollEl = document.getElementById('tlScroll');
  document.getElementById('zoomInBtn').addEventListener('click', function(){ setZoom(pxPerSec * 1.25); });
  document.getElementById('zoomOutBtn').addEventListener('click', function(){ setZoom(pxPerSec / 1.25); });
  document.getElementById('followToggle').addEventListener('change', function(e){
    followPlayhead = e.target.checked;
    document.getElementById('followChip').classList.toggle('on', followPlayhead);
  });
  document.getElementById('followChip').classList.add('on');
  document.getElementById('tlLanes').addEventListener('click', function(e){
    if (isRecording) return;
    var rect = this.getBoundingClientRect();
    var x = e.clientX - rect.left;
    seekTo(x / pxPerSec);
  });
  tlScrollEl.addEventListener('pointerdown', tlPointerDown);
  tlScrollEl.addEventListener('pointermove', tlPointerMove, { passive:false });
  tlScrollEl.addEventListener('pointerup', tlPointerUp);
  tlScrollEl.addEventListener('pointercancel', tlPointerUp);
  tlScrollEl.addEventListener('pointerleave', tlPointerUp);
  var tlResizeTimer = null;
  function handleTlResize(){
    if (tlResizeTimer) clearTimeout(tlResizeTimer);
    tlResizeTimer = setTimeout(function(){
      if (!userZoomed) pxPerSec = defaultPxPerSec();
      renderTimeline();
    }, 150);
  }
  window.addEventListener('resize', handleTlResize);
  window.addEventListener('orientationchange', handleTlResize);
  pxPerSec = defaultPxPerSec();

  updateDefaultProjectName();
  updateProjectLocationText();
  if (!isAndroidBridge()){
    loadHandleFromDb().then(function(handle){
      if (!handle) return;
      projectDirectoryHandle = handle;
      updateProjectLocationText();
      handle.queryPermission({ mode:'readwrite' }).then(function(state){
        if (state !== 'granted'){
          var el = document.getElementById('projectLocation');
          if (el) el.textContent += ' (저장 시 권한 재확인)';
        }
      }).catch(function(){});
    });
  }
  buildPiano();
  initMidiInput();
  renderTimeline();
  updateTransportUI();
})();
</script>
