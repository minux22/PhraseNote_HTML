<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#0e0f11">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PhraseNote</title>
<style>
  :root{
    --bg: #e9faf5;
    --bg-2: #ccefe5;
    --panel: rgba(255,255,255,0.94);
    --panel-2: #f4fcfa;
    --line: #b8e2d8;
    --text: #24524b;
    --text-dim: #6a918a;
    --amber: #f5a33b;
    --amber-dim: #ffd49a;
    --yellow: #ffe27a;
    --rec: #ef786b;
    --blue: #3d7fd9;
    --sky: #3bb4e8;
    --radius: 24px;
    --lane-h: 52px;
    --sans: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
    --mono: 'DejaVu Sans Mono', 'SFMono-Regular', Consolas, monospace;
  }
  @media (orientation: landscape){ :root{ --lane-h: 64px; } }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; height:100%;
    background:
      radial-gradient(circle at 8% 4%, rgba(255,255,255,.78) 0 7%, transparent 8%),
      radial-gradient(circle at 92% 18%, rgba(255,255,255,.55) 0 6%, transparent 7%),
      linear-gradient(180deg, var(--bg), var(--bg-2));
    color:var(--text);
    font-family:var(--sans); overscroll-behavior:none; user-select:none;
  }
  button{ font-family:var(--sans); -webkit-user-select:none; }
  #app{ min-height:100vh; display:flex; flex-direction:column; max-width:560px; margin:0 auto; padding:10px 12px 24px; }

  /* ---------- header ---------- */
  header{ display:flex; align-items:center; justify-content:space-between; padding:0 3px 9px; border-bottom:2px solid rgba(184,226,216,.7); margin-bottom:9px; }
  header h1{ font-size:21px; letter-spacing:0.01em; margin:0; font-weight:800; color:var(--text); }
  header h1::before{ content:'♪'; display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; margin-right:6px; border-radius:50%; background:#fff; box-shadow:0 3px 10px rgba(70,150,135,.12); font-size:14px; vertical-align:2px; }
  header .tape-mark{ font-family:var(--mono); font-size:10.5px; color:var(--text-dim); background:rgba(255,255,255,.55); padding:4px 8px; border-radius:999px; }

  section{ margin-bottom:10px; }
  .panel{ background:var(--panel); border:1px solid rgba(184,226,216,.9); border-radius:22px; padding:11px; box-shadow:0 5px 14px rgba(0,0,0,.09); }
  .panel + .panel{ margin-top:6px; }
  .row{ display:flex; align-items:center; gap:8px; }
  .row + .row{ margin-top:7px; }
  .project-panel .row{ align-items:flex-end; flex-wrap:nowrap; }
  .project-panel input[type=text]{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    border-radius:14px; padding:7px 10px; font-size:14px; width:100%; min-width:0;
  }
  .project-save-btn{ flex:0 0 auto; width:auto; min-width:52px; margin:0; white-space:nowrap; border:1px solid var(--blue); background:var(--blue); color:#fff; border-radius:999px; padding:7px 12px; font-size:12.5px; font-weight:700; box-shadow:0 2px 6px rgba(0,0,0,.08); }
  .project-status{ margin-top:5px; font-size:10.5px; color:var(--text-dim); line-height:1.35; }
  .field{ display:flex; flex-direction:column; gap:4px; flex:1; }
  .field label{ font-size:11px; color:var(--text-dim); }
  select, input[type=number]{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    border-radius:14px; padding:7px 7px; font-family:var(--mono); font-size:14px; width:100%;
  }
  .timesig-widget{
    display:flex; flex-direction:row; align-items:center; gap:2px; width:auto;
    background:var(--panel-2); border:1px solid var(--line); border-radius:14px; padding:4px 6px;
  }
  .timesig-widget select.timesig-num{
    appearance:none; -webkit-appearance:none; border:none; background:transparent; width:26px;
    text-align:center; font-family:var(--mono); font-weight:800; font-size:17px; color:var(--text);
    padding:2px 0;
  }
  .timesig-slash{ font-weight:800; font-size:16px; color:var(--text-dim); }
  .bpm-readout{
    font-family:var(--mono); font-size:30px; color:var(--amber); letter-spacing:0.02em;
    line-height:1; text-shadow:0 0 12px rgba(255,159,28,0.28);
  }
  .bpm-readout small{ font-size:12px; color:var(--text-dim); margin-left:6px; }
  .toggle-chip{
    display:flex; align-items:center; gap:6px; background:var(--panel-2); border:1px solid var(--line);
    border-radius:999px; padding:6px 10px; font-size:12px; color:var(--text-dim); cursor:pointer; white-space:nowrap;
  }
  .toggle-chip.on{ color:#fff; background:var(--blue); border-color:var(--blue); font-weight:600; }
  .toggle-chip input{ display:none; }

  /* ---------- transport ---------- */
  #status-line{ font-family:var(--mono); font-size:12px; color:var(--text-dim); min-height:15px; margin-top:5px; text-align:center; }
  #status-line.live{ color:var(--rec); }
  .transport-grid{ display:flex; gap:6px; }
  .metronome-play-btn{
    flex:1; border:none; border-radius:999px; padding:14px 10px; font-size:16px; font-weight:800;
    background:var(--amber); color:#fff; box-shadow:0 4px 12px rgba(245,163,59,.35);
  }
  .metronome-play-btn.active{ background:var(--rec); box-shadow:0 4px 12px rgba(244,81,30,.35); }
  .metronome-play-btn:disabled{ opacity:.5; }
  #metronomeSoundSelect{ flex:0 0 auto; width:auto; min-width:118px; }
  .t-btn{
    flex:1; aspect-ratio:1/1; max-width:56px; border:1px solid var(--line); border-radius:13px;
    background:var(--panel-2); box-shadow:0 2px 6px rgba(0,0,0,.06);
    color:var(--text); font-size:19px; display:flex; align-items:center; justify-content:center; padding:0;
  }
  .t-btn.rec.active{ background:var(--rec); color:#fff; border-color:var(--rec); animation:pulse 1s infinite; }
  .t-btn.midi.active{ background:var(--amber); color:#fff; border-color:var(--amber); }
  .t-btn.play.active{ background:var(--blue); color:#fff; border-color:var(--blue); }
  .t-btn.metro.active{ background:rgba(59,180,232,0.28); color:var(--blue); border-color:rgba(59,180,232,0.55); }
  .t-btn:disabled{ opacity:0.35; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.55;} }
  .wide-btn{
    width:100%; margin-top:7px; border:1px solid var(--line); border-radius:18px;
    padding:9px 10px; background:var(--panel-2); color:var(--text); font-size:13px; font-weight:700;
    box-shadow:0 3px 8px rgba(0,0,0,.05);
  }
  .master-vol{ margin-top:8px; }
  #masterVol{ accent-color:var(--sky); }
  input[type=range]{ width:100%; accent-color:var(--amber); }

  /* ---------- multitrack timeline ---------- */
  #tracksTitle{ font-size:12px; color:var(--text-dim); margin:0; }
  .tl-toolbar{ display:flex; align-items:center; gap:6px; margin-bottom:7px; }
  .tl-zoom-btn{
    width:28px; height:28px; border-radius:50%; border:1px solid var(--line);
    background:var(--panel-2); color:var(--text); font-size:16px; font-weight:800;
    display:flex; align-items:center; justify-content:center; padding:0; flex:0 0 auto;
  }
  .tl-body{ display:flex; border:1px solid var(--line); border-radius:18px; overflow:hidden; background:var(--panel); box-shadow:0 4px 12px rgba(0,0,0,.06); }
  .tl-controls{ flex:0 0 120px; display:flex; flex-direction:column; border-right:1px solid var(--line); background:rgba(61,127,217,.07); }
  .tl-ruler-spacer{ height:22px; border-bottom:1px solid var(--line); }
  .tl-ctrl-row{ height:var(--lane-h); box-sizing:border-box; display:flex; flex-direction:column; justify-content:center; gap:2px; padding:3px 6px; border-bottom:1px solid var(--line); }
  .tl-row1{ display:flex; align-items:center; gap:3px; }
  .tl-row1 .name{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:10px; font-weight:700; }
  .tl-row1 .track-select-cb{ flex:0 0 auto; width:13px; height:13px; margin:0; accent-color:var(--blue); }
  .tl-ctrl-row .mini-btn{
    width:16px; height:16px; padding:0; font-size:8.5px; border-radius:50%; flex:0 0 auto;
    border:1px solid var(--line); background:var(--panel); color:var(--text-dim); display:flex; align-items:center; justify-content:center;
  }
  .tl-ctrl-row .mini-btn.on{ color:var(--amber); border-color:var(--amber); }
  .tl-ctrl-row .mini-btn.solo-on{ color:var(--blue); border-color:var(--blue); }
  .tl-ctrl-row input[type=range]{ width:100%; height:10px; margin:0; accent-color:var(--sky); }
  .tl-scroll{ flex:1; overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch; }
  .tl-content{ position:relative; }
  .tl-ruler{ display:block; cursor:pointer; border-bottom:1px solid var(--line); }
  .tl-lane{ height:var(--lane-h); box-sizing:border-box; border-bottom:1px solid var(--line); position:relative; cursor:pointer; }
  .tl-lane canvas{ display:block; position:absolute; top:0; left:0; }
  #tlPlayhead{ position:absolute; top:0; bottom:0; left:0; width:2px; background:var(--rec); z-index:5; pointer-events:none; display:block; }
  .rec-clip{ position:absolute; top:12%; height:76%; border-radius:8px; background:rgba(244,81,30,.28); border:1px solid var(--rec); box-sizing:border-box; display:flex; align-items:center; z-index:2; pointer-events:none; overflow:hidden; }
  .rec-clip span{ font-size:10.5px; color:var(--rec); font-weight:700; padding-left:6px; white-space:nowrap; }
  .tl-ctrl-row{ cursor:pointer; border-left:3px solid transparent; }
  .tl-ctrl-row.armed{ background:rgba(244,81,30,.10); border-left-color:var(--rec); }
  .tl-ctrl-row.armed .name{ color:var(--rec); }
  .tl-ctrl-row.armed.is-recording{ animation:pulse 1s infinite; }
  .tl-ctrl-row.is-empty .name{ opacity:.6; font-weight:600; }
  .tl-ctrl-row .hidden-ctl{ visibility:hidden; }
  .tl-lane.emptylane{ display:flex; align-items:center; background:repeating-linear-gradient(90deg, rgba(61,127,217,.05) 0 8px, transparent 8px 16px); }
  .t-btn.target:not(.active){ box-shadow:0 0 0 2px rgba(244,81,30,.5); }
  #toast{ position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:rgba(23,50,60,.94); color:#fff; padding:9px 15px; border-radius:999px; font-size:12.5px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:100; max-width:92vw; text-align:center; }
  #toast.show{ opacity:1; }
  .empty-hint{ color:var(--text-dim); font-size:12.5px; text-align:center; padding:12px 10px; border:1px dashed var(--line); border-radius:20px; background:rgba(255,255,255,.4); margin-top:8px; }


  /* ---------- keyboard (inline, always visible) ---------- */
  #keyboardPanel{ padding-bottom:8px; }
  #kbTopBar{ display:flex; align-items:center; gap:6px; margin-bottom:6px; }
  .kb-icon-btn{
    flex:0 0 auto; width:30px; height:30px; border-radius:50%; border:1px solid var(--line);
    background:var(--panel-2); color:var(--text); font-size:12px; display:flex;
    align-items:center; justify-content:center; padding:0;
  }
  .kb-icon-btn.rec-toggle.active{ background:var(--rec); color:#fff; border-color:var(--rec); }
  .kb-icon-btn.play-toggle.active{ background:var(--blue); color:#fff; border-color:var(--blue); }
  #kbVol{ flex:1 1 auto; width:auto; min-width:60px; max-width:260px; accent-color:var(--sky); margin:0; }

  #pianoWrap{ height:150px; display:flex; flex-direction:column; gap:5px; touch-action:none; -webkit-user-select:none; user-select:none; }
  .pkey{ touch-action:none; -webkit-touch-callout:none; }
  .piano-row{ position:relative; flex:1; min-height:0; }
  .white-row{ display:flex; height:100%; gap:2px; }
  .pkey{ user-select:none; font-family:var(--mono); }
  .pkey.white{
    flex:1; height:100%; border-radius:0 0 10px 10px; display:flex; align-items:flex-end;
    justify-content:center; padding-bottom:6px; font-size:10.5px; font-weight:700;
    background:#fffaf1; color:#a99a8a; border:1px solid #d9d0c4;
  }
  .pkey.black{
    position:absolute; top:0; height:58%; z-index:2; border-radius:0 0 7px 7px;
    display:flex; align-items:flex-end; justify-content:center; padding-bottom:4px;
    background:#4c5552; color:#e6f5f0; border:1px solid #3e4643; font-size:8px;
  }
  .pkey.white{ flex-direction:column; justify-content:flex-end; align-items:center; gap:2px; }
  .pkey .kl{ font-weight:800; font-size:12px; line-height:1; }
  .pkey .kn{ font-size:9px; font-weight:700; opacity:.7; }
  .pkey.white .kl{ color:#bdb2a3; }
  .pkey.white .kn{ color:#cfc6b9; }
  .pkey.black .kl{ font-size:10px; color:#80868e; }
  .pkey.active.white{ background:var(--amber); color:#fff; }
  .pkey.active.black{ background:var(--amber-dim); color:#4c5552; }

  footer{ text-align:center; color:var(--text-dim); font-size:10.5px; margin-top:10px; opacity:0.7; }

  /* ---------- mic permission banner ---------- */
  .mic-banner{
    background:#fff8eb; border:1px solid #f1c77d; border-radius:20px;
    padding:9px 11px; margin-bottom:9px;
  }
  .mic-banner p{ margin:0 0 7px; font-size:12.5px; color:var(--text); line-height:1.4; }
  .mic-banner-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .mic-banner-actions button{
    border:1px solid var(--amber); background:var(--amber); color:#fff; border-radius:999px;
    padding:6px 10px; font-size:12px; font-weight:600;
  }
  .mic-banner-actions button.ghost{ background:transparent; color:var(--amber-dim); border-color:var(--line); }
  #micGuideText{ margin-top:10px; font-size:12.5px; color:var(--text-dim); line-height:1.7; border-top:1px dashed var(--line); padding-top:10px; }
  #micGuideText b{ color:var(--text); }

  /* ---------- live waveform during recording ---------- */
  .live-wave-wrap{ display:none; margin-top:7px; }
  .live-wave-wrap.active{ display:block; }
  #liveWaveCanvas{ width:100%; height:48px; display:block; background:var(--panel-2); border:1px solid var(--line); border-radius:14px; }

  /* ---------- cute rounded touch ---------- */
  button, select, input{ transition:transform .12s ease, box-shadow .12s ease, background .12s ease; }
  button:active{ transform:scale(.94); }
  .project-save-btn{ border-radius:999px; }
  .project-save-btn.danger{ border-color:var(--rec); background:var(--rec); }
  .project-panel{ background:rgba(255,255,255,.97); }
  /* ---- 클립 모델 UI ---- */
  .tl-ctrl-row{ padding:2px 5px 2px 4px; gap:2px; border-left:4px solid transparent; cursor:pointer; }
  .tl-ctrl-row.type-audio{ border-left-color:var(--sky); }
  .tl-ctrl-row.type-midi{ border-left-color:var(--amber); }
  .tl-ctrl-row.armed{ background:rgba(244,81,30,.09); box-shadow:inset 0 0 0 2px rgba(244,81,30,.55); }
  .tl-ctrl-row.armed .name{ color:var(--rec); }
  .tl-row1, .tl-row2{ display:flex; align-items:center; gap:4px; }
  .tl-row1 .ticon{ flex:0 0 13px; display:flex; }
  .tl-ctrl-row.type-audio .ticon{ color:var(--sky); }
  .tl-ctrl-row.type-midi .ticon{ color:var(--amber); }
  .tl-row1 .name{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:10.5px; font-weight:700; }
  .tl-row1 .track-select-cb{ flex:0 0 auto; width:12px; height:12px; margin:0; accent-color:var(--blue); }
  .tl-ctrl-row .mini-btn{ width:21px; height:21px; font-size:11px; }
  .tl-ctrl-row .mini-btn.del-btn{ color:var(--rec); border-color:rgba(244,81,30,.45); font-weight:800; }
  .tl-row2 .vol-slider{ flex:1; min-width:0; width:auto; height:14px; margin:0; }
  .clip{ position:absolute; top:3px; bottom:3px; border-radius:9px; overflow:hidden; box-sizing:border-box; border:1.5px solid; cursor:pointer; }
  .clip.audio{ border-color:var(--sky); background:rgba(59,180,232,.13); }
  .clip.midi{ border-color:var(--amber); background:rgba(245,163,59,.15); }
  .clip.selected{ box-shadow:0 0 0 2px var(--text); }
  .clip canvas, .rec-clip canvas{ position:absolute; left:0; top:0; }
  .clip-del{ position:absolute; top:6px; width:24px; height:24px; border-radius:50%; border:none; background:var(--rec); color:#fff; font-size:12px; font-weight:800; z-index:4; display:flex; align-items:center; justify-content:center; padding:0; box-shadow:0 2px 6px rgba(0,0,0,.25); }
  .rec-clip{ top:3px; bottom:3px; height:auto; border-radius:9px; border:1.5px solid var(--rec); background:rgba(244,81,30,.10); overflow:hidden; }
  .rec-clip::before{ content:'●'; position:absolute; left:4px; top:1px; font-size:9px; color:var(--rec); z-index:2; animation:pulse 1s infinite; }
  .tl-empty-hint{ padding:14px 10px; font-size:12px; color:var(--text-dim); }
  .tl-add-row{ display:flex; gap:8px; margin-top:8px; }
  .add-track-btn{ flex:1; border-radius:999px; padding:9px 10px; font-size:12.5px; font-weight:700; background:var(--panel); border:1.5px solid; }
  .add-track-btn.audio{ border-color:var(--sky); color:#1f93c4; }
  .add-track-btn.midi{ border-color:var(--amber); color:#d98a1c; }
  .tl-zoom-btn:disabled{ opacity:.35; }
  #toast.has-action{ pointer-events:auto; }
  #toast button{ margin-left:10px; background:transparent; border:1px solid rgba(255,255,255,.65); color:#fff; border-radius:999px; padding:3px 10px; font-size:12px; font-weight:700; }
  /* ===== 다크 테마: 검정~진한 회색 바탕 + 버튼만 유색 포인트 ===== */
  :root{
    color-scheme: dark;
    --bg:#0e0f11; --bg-2:#131417;
    --panel:#1b1d21; --panel-2:#262a2f;
    --line:#363a41;
    --text:#eceef1; --text-dim:#8d939c;
    --amber:#f5a33b; --amber-dim:#c9831f;
    --rec:#ff5d50; --blue:#4d8ff5; --sky:#3bb4e8;
  }
  html,body{ background:var(--bg); }
  header{ border-bottom-color:var(--line); }
  header h1::before{ background:var(--panel-2); color:var(--amber); box-shadow:none; }
  header .tape-mark{ background:var(--panel-2); color:var(--text-dim); }
  .panel, .project-panel{ background:var(--panel); border-color:var(--line); box-shadow:0 4px 16px rgba(0,0,0,.4); }
  .tl-body{ background:var(--panel); border-color:var(--line); box-shadow:0 4px 16px rgba(0,0,0,.4); }
  .tl-controls{ background:rgba(255,255,255,.025); border-right-color:var(--line); }
  .tl-lane.emptylane{ background:repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 8px, transparent 8px 16px); }
  .empty-hint{ background:transparent; }

  /* 버튼: 바탕은 어둡게, 기능별 색은 버튼에만 */
  .t-btn{ background:var(--panel-2); border-color:var(--line); box-shadow:none; }
  .t-btn.rec{ color:#ff7a6e; }
  .t-btn.midi{ color:var(--amber); }
  .t-btn.play{ color:#7db0ff; }
  .t-btn.metro{ color:var(--sky); }
  .t-btn.rec.active{ background:var(--rec); color:#fff; border-color:var(--rec); }
  .t-btn.midi.active{ background:var(--amber); color:#1b1405; border-color:var(--amber); }
  .t-btn.play.active{ background:var(--blue); color:#fff; border-color:var(--blue); }
  .t-btn.metro.active{ background:rgba(59,180,232,.2); color:var(--sky); border-color:rgba(59,180,232,.65); }
  .t-btn.target:not(.active){ box-shadow:0 0 0 2px rgba(255,93,80,.6); }
  .metronome-play-btn{ background:var(--amber); color:#1b1405; box-shadow:0 4px 14px rgba(245,163,59,.28); }
  .metronome-play-btn.active{ background:var(--rec); color:#fff; box-shadow:0 4px 14px rgba(255,93,80,.3); }
  .kb-icon-btn.rec-toggle{ color:#ff7a6e; }
  .kb-icon-btn.play-toggle{ color:#7db0ff; }
  .kb-icon-btn.rec-toggle.active{ background:var(--rec); color:#fff; border-color:var(--rec); }
  .kb-icon-btn.play-toggle.active{ background:var(--blue); color:#fff; border-color:var(--blue); }
  .toggle-chip{ background:var(--panel-2); color:var(--text-dim); border-color:var(--line); }
  .toggle-chip.on{ background:var(--blue); border-color:var(--blue); color:#fff; }
  .project-save-btn{ box-shadow:none; color:#fff; }
  .add-track-btn{ background:var(--panel-2); }
  .add-track-btn.audio{ border-color:var(--sky); color:#5cc8f2; }
  .add-track-btn.midi{ border-color:var(--amber); color:var(--amber); }
  .mic-banner{ background:#2a2214; border-color:#7a5a1f; }
  .mic-banner-actions button{ color:#1b1405; }
  .mic-banner-actions button.ghost{ background:transparent; color:var(--text-dim); border-color:var(--line); }
  #toast{ background:#2d3036; border:1px solid #484d55; color:#fff; box-shadow:0 6px 20px rgba(0,0,0,.5); }

  /* 트랙 영역 */
  .tl-ctrl-row.armed{ background:rgba(255,93,80,.12); box-shadow:inset 0 0 0 2px rgba(255,93,80,.6); }
  .tl-ctrl-row .mini-btn.del-btn{ color:var(--rec); border-color:rgba(255,93,80,.5); }
  .clip.audio{ background:rgba(59,180,232,.16); }
  .clip.midi{ background:rgba(245,163,59,.18); }
  .rec-clip{ border-color:var(--rec); background:rgba(255,93,80,.12); }

  /* 건반 */
  .pkey.black{ background:#17181b; color:#c9ced4; border:1px solid #000; }
  .pkey.active.white{ background:var(--amber); color:#1b1405; }
  .pkey.active.black{ background:var(--amber-dim); color:#fff; }
  /* 토글 칩: 켜짐 = 테두리·글자에만 색 (중요도 낮은 옵션이라 튀지 않게) */
  .toggle-chip.on{ background:var(--panel-2); border-color:var(--blue); color:#7db0ff; font-weight:600; }
  /* 설정 줄: 박스 2개 (BPM·박자표 / 카운트인), 안쪽 컨트롤은 높이·모서리를 통일 */
  .setup-row{ display:flex; gap:6px; align-items:stretch; }
  .setup-row .panel{ margin-top:0; display:flex; align-items:center; }
  .setup-row .panel:first-child{ flex:1 1 auto; min-width:0; }
  .setup-row .panel:last-child{ flex:0 0 auto; }
  .setup-row .row{ align-items:flex-end; }
  .countin-row{ display:flex; align-items:center; gap:5px; }
  #bpmInput, .timesig-widget, .countin-row .toggle-chip, #countInBars{ height:34px; box-sizing:border-box; }
  .timesig-widget{ padding-top:0; padding-bottom:0; }
  .timesig-widget select.timesig-num{ padding:0; }
  .countin-row .toggle-chip{ border-radius:14px; padding:0 11px; }
  #countInBars{ width:auto; min-width:0; padding:0 4px 0 9px; font-size:14px; border-radius:14px; }
  #countInBars:disabled{ opacity:.4; }
  .countin-unit{ font-size:12px; color:var(--text-dim); }
  /* 트랜스포트 박스: 여백과 버튼 크기를 줄여 컴팩트하게 */
  .transport-panel{ padding:7px 9px; }
  .transport-grid{ justify-content:space-between; }
  .t-btn{ max-width:46px; border-radius:12px; }
  .live-wave-wrap{ margin-top:6px; }
</style>
</head>
<body>
<div id="app">

  <header>
    <h1>PhraseNote</h1>
    <span class="tape-mark">By Min</span>
  </header>

  <section class="panel" id="metronomePanel">
    <div class="row">
      <button class="metronome-play-btn" id="metronomeStandaloneBtn">▶ 메트로놈 재생</button>
      <select id="metronomeSoundSelect">
        <option value="click" selected>클릭</option>
        <option value="wood">탁 (우드블록)</option>
        <option value="maracas">마라카스</option>
      </select>
    </div>
    <div class="master-vol">
      <label style="font-size:11px;color:var(--text-dim)">마스터 볼륨(듣기 전용 · 저장 파일에는 영향 없음) <span id="masterVolValue">1.0x</span></label>
      <input type="range" id="masterVol" min="0" max="4" step="0.05" value="1">
    </div>
    <div id="status-line" style="display:none">대기 중</div>

  <section class="setup-row">
    <div class="panel">
      <div class="row">
        <div class="field" style="flex:0 0 76px;">
          <label>BPM</label>
          <input type="number" id="bpmInput" min="30" max="260" value="80">

        <div class="field" style="flex:0 0 auto;">
          <label>박자표</label>
          <div class="timesig-widget">
            <select id="beatsSelect" class="timesig-num">
              <option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option><option>7</option><option>9</option><option>12</option>
            </select>
            <span class="timesig-slash">/</span>
            <select id="noteValueSelect" class="timesig-num">
              <option value="2">2</option><option value="4" selected>4</option><option value="8">8</option><option value="16">16</option>
            </select>
          </div>
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="field" style="flex:0 0 auto;">
        <label>카운트인</label>
        <div class="countin-row">
          <label class="toggle-chip" id="countinChip"><input type="checkbox" id="countinToggle" checked><span id="countinState">켜짐</span></label>
          <select id="countInBars" title="카운트인 마디 수"><option value="1">1</option><option value="2" selected>2</option></select>
          <span class="countin-unit">마디</span>
        </div>
      </div>
    </div>
  </section>

  <div class="mic-banner" id="micBanner" style="display:none">
    <p id="micBannerText"></p>
    <div class="mic-banner-actions">
      <button id="micRetryBtn">다시 시도</button>
      <button class="ghost" id="micGuideBtn">허용 방법 보기</button>
      <button class="ghost" id="micCloseBtn">닫기</button>
    </div>
    <div id="micGuideText" style="display:none"></div>
  </div>

  <section class="panel transport-panel">
    <div class="transport-grid">
      <button class="t-btn rec" id="recAudioBtn" title="오디오 녹음"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 10v1a7 7 0 0 0 14 0v-1"></path><line x1="12" y1="19" x2="12" y2="22"></line><line x1="8" y1="22" x2="16" y2="22"></line></svg></button>
      <button class="t-btn midi" id="recMidiBtn" title="미디 녹음"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"></rect><line x1="8" y1="6" x2="8" y2="14"></line><line x1="12" y1="6" x2="12" y2="14"></line><line x1="16" y1="6" x2="16" y2="14"></line></svg></button>
      <button class="t-btn play" id="playBtn" title="전체 재생">▶</button>
      <button class="t-btn" id="stopBtn" title="정지">■</button>
      <button class="t-btn" id="rewindBtn" title="처음으로"><svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><rect x="4" y="5" width="3" height="14" rx="1"></rect><path d="M20 5v14L9 12z"></path></svg></button>
      <button class="t-btn metro" id="metroToggleBtn" title="재생·녹음 시 메트로놈"><svg viewBox="0 0 24 24" width="27" height="27" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8l-2-14h-4z"></path><line x1="12" y1="7" x2="15" y2="19"></line><circle cx="12" cy="4" r="1.3"></circle><line x1="12" y1="5.3" x2="12" y2="7"></line></svg></button>
    </div>
    <div class="live-wave-wrap" id="liveWaveWrap"><canvas id="liveWaveCanvas" width="500" height="60"></canvas></div>
  </section>

  <section>
    <div class="tl-toolbar">
      <p id="tracksTitle">트랙</p>
      <button class="tl-zoom-btn" id="undoBtn" title="되돌리기" disabled>↶</button>
      <div style="flex:1"></div>
      <button class="tl-zoom-btn" id="zoomOutBtn">−</button>
      <button class="tl-zoom-btn" id="zoomInBtn">+</button>
      <label class="toggle-chip" id="followChip"><input type="checkbox" id="followToggle" checked>재생헤드 따라가기</label>
    </div>
    <div class="tl-body">
      <div class="tl-controls" id="tlControls"><div class="tl-ruler-spacer"></div></div>
      <div class="tl-scroll" id="tlScroll">
        <div class="tl-content" id="tlContent">
          <canvas class="tl-ruler" id="tlRuler"></canvas>
          <div id="tlLanes"></div>
          <div id="tlPlayhead"></div>
        </div>
      </div>
    </div>
    <div class="tl-add-row">
      <button class="add-track-btn audio" id="addAudioTrackBtn">＋ 오디오 트랙</button>
      <button class="add-track-btn midi" id="addMidiTrackBtn">＋ 미디 트랙</button>
    </div>
  </section>

  <section class="panel" id="keyboardPanel">
    <div id="kbTopBar">
      <button class="kb-icon-btn rec-toggle" id="kbRecBtn">●</button>
      <button class="kb-icon-btn play-toggle" id="kbPlayBtn">▶</button>
      <button class="kb-icon-btn" id="kbStopBtn">■</button>
      <input type="range" class="kb-vol" id="kbVol" min="0" max="1.2" step="0.05" value="0.5" title="건반 소리 크기">
    </div>
    <div id="pianoWrap"></div>
  </section>

  <section class="panel project-panel">
    <p style="margin:0 0 8px;font-size:12px;color:var(--text-dim);">저장 세션</p>
    <div class="row">
      <div class="field">
        <label>프로젝트명</label>
        <input type="text" id="projectNameInput" value="" maxlength="80" placeholder="yymmdd_hhmm_000BPM_PhraseNote">
      </div>
      <button class="project-save-btn" id="saveProjectBtn">저장</button>
    </div>
    <div class="row" style="margin-top:8px;">
      <button class="mini-btn" id="selectAllTracksBtn">전체 선택</button>
      <button class="mini-btn" id="selectNoneTracksBtn">전체 해제</button>
      <div style="flex:1"></div>
      <span style="font-size:11px;color:var(--text-dim);">체크된 트랙만 저장돼요</span>
    </div>
    <div class="row" style="margin-top:6px;">
      <label class="toggle-chip on" id="mixChip"><input type="checkbox" id="mixToggle" checked>전체 믹스 파일 저장</label>
      <div style="flex:1"></div>
      <button class="project-save-btn danger" id="newSessionBtn">새로 시작</button>
    </div>
    <div id="projectStatus" class="project-status">저장을 누르면 다운로드 폴더에 파일이 저장돼요.</div>
  </section>

  <div id="toast"></div>
  <footer>헤드폰 사용을 권장해요 · 마이크가 메트로놈 소리를 함께 녹음할 수 있어요</footer>
</div>

<script>
(function(){
  'use strict';

  /* ============ state ============ */
  var audioCtx = null, masterGain = null, metronomeGain = null, outputLimiter = null;
  var micStream = null, mediaRecorder = null, recordedChunks = [];
  var micSourceNode = null, analyser = null, liveWaveRAF = null;
  var tracks = []; var trackIdSeq = 1;
  var bpm = 80, beatsPerBar = 4, noteValue = 4;
  var countInEnabled = true, countInBars = 2, metronomeSound = 'click';
  var metronomeDuringPlayback = true;
  var metronomeStandaloneRunning = false;
  var isRecording = false, recordingType = null;
  var isPlaying = false;
  var schedulerTimer = null, nextClickTime = 0, currentClickBeat = 0;
  var activeSources = [];
  var recordStartCtxTime = 0;
  var pendingRecordOffset = 0;
  var playheadSeconds = 0, playheadBaseSeconds = 0;
  var tempMidiNotes = [];
  var activeNoteOns = {};
  var playStopTimer = null;
  var projectBaseName = 'PhraseNote';
  var noiseBuffer = null;

  /* ============ audio core ============ */
  function initAudio(){
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    // 듣기 경로에만 쓰는 안전장치(리미터). 볼륨을 키워도 찌그러지지 않게 눌러줌.
    // 저장 파일은 이 경로를 거치지 않으므로 원본 그대로 유지됨.
    outputLimiter = audioCtx.createDynamicsCompressor();
    outputLimiter.threshold.value = -1.5;
    outputLimiter.knee.value = 0;
    outputLimiter.ratio.value = 20;
    outputLimiter.attack.value = 0.003;
    outputLimiter.release.value = 0.12;
    outputLimiter.connect(audioCtx.destination);
    masterGain = audioCtx.createGain();
    masterGain.gain.value = parseFloat(document.getElementById('masterVol').value);
    masterGain.connect(outputLimiter);
    metronomeGain = audioCtx.createGain();
    metronomeGain.gain.value = metronomeDuringPlayback ? 0.55 : 0;
    metronomeGain.connect(outputLimiter);
    var len = Math.floor(audioCtx.sampleRate * 0.3);
    noiseBuffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    var data = noiseBuffer.getChannelData(0);
    for (var i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  }

  function ensureMic(){
    if (micStream) return Promise.resolve();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      showMicBanner({ name:'NotSupported' });
      return Promise.reject(new Error('unsupported'));
    }
    return navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation:false, noiseSuppression:false, autoGainControl:false }
    }).then(function(s){
      micStream = s;
      hideMicBanner();
      setupAnalyser();
    }).catch(function(e){
      showMicBanner(e);
      throw e;
    });
  }

  function setupAnalyser(){
    if (!micStream || !audioCtx) return;
    if (micSourceNode) return;
    micSourceNode = audioCtx.createMediaStreamSource(micStream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024;
    micSourceNode.connect(analyser);
  }

  /* ---------- mic permission banner ---------- */
  function showMicBanner(err){
    var banner = document.getElementById('micBanner');
    var text = document.getElementById('micBannerText');
    var name = err && err.name;
    if (name === 'NotAllowedError' || name === 'PermissionDeniedError'){
      text.textContent = '마이크 권한이 거부되어 있어요. 브라우저 설정에서 마이크 권한을 허용한 뒤 "다시 시도"를 눌러주세요.';
    } else if (name === 'NotFoundError' || name === 'DevicesNotFoundError'){
      text.textContent = '사용할 수 있는 마이크를 찾지 못했어요. 마이크 연결을 확인해주세요.';
    } else if (name === 'NotSupported'){
      text.textContent = '이 브라우저는 마이크 녹음을 지원하지 않아요. Chrome이나 Safari 최신 버전을 사용해주세요.';
    } else {
      text.textContent = '마이크에 접근할 수 없어요. 권한 설정을 확인한 뒤 다시 시도해주세요.';
    }
    banner.style.display = 'block';
  }
  function hideMicBanner(){
    document.getElementById('micBanner').style.display = 'none';
    document.getElementById('micGuideText').style.display = 'none';
  }
  document.getElementById('micRetryBtn').addEventListener('click', function(){
    ensureMic().catch(function(){});
  });
  document.getElementById('micCloseBtn').addEventListener('click', hideMicBanner);
  document.getElementById('micGuideBtn').addEventListener('click', function(){
    var g = document.getElementById('micGuideText');
    if (g.style.display === 'none'){
      g.innerHTML =
        '<b>PC 크롬/엣지</b>: 주소창 왼쪽 자물쇠(또는 정보) 아이콘 → 사이트 설정 → 마이크 → 허용 → 새로고침<br>' +
        '<b>안드로이드 크롬</b>: 주소창의 자물쇠 아이콘 → 권한 → 마이크 → 허용<br>' +
        '<b>iOS 사파리</b>: 설정 앱 → Safari → 마이크 → "확인" 또는 "허용"으로 변경, 혹은 설정 앱 → 개인정보 보호 및 보안 → 마이크에서 브라우저 허용';
      g.style.display = 'block';
    } else {
      g.style.display = 'none';
    }
  });

  /* ---------- live waveform while recording ---------- */
  function startLiveWave(){
    var wrap = document.getElementById('liveWaveWrap');
    wrap.classList.add('active');
    if (liveWaveRAF) cancelAnimationFrame(liveWaveRAF);
    liveWaveLoop();
  }
  function stopLiveWave(){
    document.getElementById('liveWaveWrap').classList.remove('active');
    if (liveWaveRAF){ cancelAnimationFrame(liveWaveRAF); liveWaveRAF = null; }
  }
  function liveWaveLoop(){
    if (!(isRecording && recordingType === 'audio' && analyser)){ liveWaveRAF = null; return; }
    var canvas = document.getElementById('liveWaveCanvas');
    var ctx = canvas.getContext('2d');
    var buf = new Uint8Array(analyser.fftSize);
    analyser.getByteTimeDomainData(buf);
    var w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    ctx.beginPath();
    var step = buf.length / w;
    for (var x = 0; x < w; x++){
      var v = (buf[Math.floor(x * step)] / 128.0) - 1;
      var y = (0.5 + v * 0.45) * h;
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = '#ef786b';
    ctx.lineWidth = 2;
    ctx.stroke();
    liveWaveRAF = requestAnimationFrame(liveWaveLoop);
  }

  function beatDuration(){ return (60 / bpm) * (4 / noteValue); }

  function scheduleClick(time, accent){
    if (metronomeSound === 'wood') scheduleWoodClick(time, accent);
    else if (metronomeSound === 'maracas') scheduleMaracasClick(time, accent);
    else scheduleBeepClick(time, accent);
  }
  function scheduleBeepClick(time, accent){
    var osc = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = accent ? 1500 : 1000;
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(0.35, time + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, time + 0.035);
    osc.connect(g); g.connect(metronomeGain);
    osc.start(time); osc.stop(time + 0.05);
  }
  function scheduleWoodClick(time, accent){
    var src = audioCtx.createBufferSource(); src.buffer = noiseBuffer;
    var filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = accent ? 2200 : 1500;
    filter.Q.value = 6;
    var g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(accent ? 0.9 : 0.6, time + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, time + 0.03);
    src.connect(filter); filter.connect(g); g.connect(metronomeGain);
    src.start(time); src.stop(time + 0.04);
  }
  function scheduleMaracasClick(time, accent){
    var src = audioCtx.createBufferSource(); src.buffer = noiseBuffer;
    var filter = audioCtx.createBiquadFilter();
    filter.type = 'highpass';
    filter.frequency.value = 4000;
    var g = audioCtx.createGain();
    var peak = accent ? 0.5 : 0.32, dur = accent ? 0.09 : 0.06;
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(peak, time + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    src.connect(filter); filter.connect(g); g.connect(metronomeGain);
    src.start(time); src.stop(time + dur + 0.02);
  }

  function schedulerTick(){
    while (nextClickTime < audioCtx.currentTime + 0.1){
      var barPos = ((currentClickBeat % beatsPerBar) + beatsPerBar) % beatsPerBar;
      if (metronomeDuringPlayback) scheduleClick(nextClickTime, barPos === 0);
      var s = document.getElementById('status-line');
      var label = '마디 ' + (Math.floor(currentClickBeat / beatsPerBar) + 1) + ' · 박 ' + (barPos + 1);
      if (isRecording && recordStartCtxTime > nextClickTime + 1e-4) label = '카운트인 · ' + Math.round((recordStartCtxTime - nextClickTime) / beatDuration());
      s.textContent = (isRecording ? '녹음 중 · ' : (isPlaying ? '재생 중 · ' : (metronomeStandaloneRunning ? '' : ''))) + label;
      s.className = isRecording ? 'live' : '';
      nextClickTime += beatDuration();
      currentClickBeat++;
    }
  }

  function startScheduler(startCtxTime, fromSeconds){
    var bd = beatDuration();
    fromSeconds = fromSeconds || 0;
    // fromSeconds가 음수(카운트인 구간)여도 실제 박자 격자에 맞춰 계산
    currentClickBeat = Math.ceil(fromSeconds / bd - 1e-6);
    nextClickTime = startCtxTime + (currentClickBeat * bd - fromSeconds);
    if (schedulerTimer) clearInterval(schedulerTimer);
    schedulerTimer = setInterval(schedulerTick, 25);
  }
  function stopScheduler(){
    if (schedulerTimer){ clearInterval(schedulerTimer); schedulerTimer = null; }
  }

  /* ---- 메트로놈 단독 재생 (정지 상태에서 BPM/박자 감 잡기용) ---- */
  function startMetronomeStandalone(){
    initAudio(); audioCtx.resume();
    var startTime = audioCtx.currentTime + 0.08;
    startScheduler(startTime, 0);
    metronomeStandaloneRunning = true;
    acquireWakeLock();
    updateMetronomeStandaloneUI();
  }
  function stopMetronomeStandalone(){
    stopScheduler();
    metronomeStandaloneRunning = false;
    releaseWakeLock();
    document.getElementById('status-line').textContent = '대기 중';
    document.getElementById('status-line').className = '';
    updateMetronomeStandaloneUI();
  }
  function updateMetronomeStandaloneUI(){
    var btn = document.getElementById('metronomeStandaloneBtn');
    if (!btn) return;
    btn.textContent = metronomeStandaloneRunning ? '■ 메트로놈 정지' : '▶ 메트로놈 재생';
    btn.classList.toggle('active', metronomeStandaloneRunning);
    btn.disabled = isRecording || isPlaying;
  }

  /* ---- 재생헤드(커서) 위치 ---- */
  function renderPlayheadPosition(){
    var ph = document.getElementById('tlPlayhead');
    if (!ph) return;
    ph.style.transform = 'translateX(' + (playheadSeconds * pxPerSec) + 'px)';
  }
  function seekTo(seconds){
    if (isRecording) return;
    seconds = Math.max(0, seconds);
    var wasPlaying = isPlaying;
    if (wasPlaying){
      stopActiveSources();
      stopScheduler();
      stopPlayheadLoop();
      isPlaying = false;
    }
    playheadSeconds = seconds;
    renderPlayheadPosition();
    updateTransportUI();
    if (wasPlaying && seconds < sessionContentEnd() - 0.05) playAll(); else if (wasPlaying) releaseWakeLock();
  }

  var EP_LEVEL = 0.5;   // 건반(EP) 음량 — 건반 패널의 볼륨 바로 조절 (라이브 연주·미디 재생·믹스에 모두 적용)

  /* simple "EP" synth voice, rendered against any given AudioContext (live or offline) */
  function playEP(ctx, freq, startTime, duration, dest, velocity){
    velocity = velocity || 1;
    var o1 = ctx.createOscillator(); o1.type = 'sine'; o1.frequency.value = freq;
    var o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = freq * 2.005;
    var g2 = ctx.createGain(); g2.gain.value = 0.16 * velocity;
    var filter = ctx.createBiquadFilter(); filter.type = 'lowpass';
    filter.frequency.setValueAtTime(4200, startTime);
    filter.frequency.exponentialRampToValueAtTime(1500, startTime + duration + 0.25);
    // 누른 길이만큼 유지되다가 뗄 때 끊기는 포락선 (예전엔 시작부터 끝까지 감쇠해서 튕기는 소리처럼 들렸음)
    var amp = ctx.createGain();
    var peak = 0.8 * velocity * EP_LEVEL;
    var sustain = 0.45 * velocity * EP_LEVEL;
    var decayAt = startTime + Math.min(0.22, duration * 0.4);
    amp.gain.setValueAtTime(0.0001, startTime);
    amp.gain.exponentialRampToValueAtTime(peak, startTime + 0.006);
    amp.gain.exponentialRampToValueAtTime(sustain, decayAt);
    amp.gain.exponentialRampToValueAtTime(sustain * 0.75, startTime + duration);
    amp.gain.exponentialRampToValueAtTime(0.0001, startTime + duration + 0.22);
    o1.connect(filter); o2.connect(g2); g2.connect(filter);
    filter.connect(amp); amp.connect(dest);
    var stopT = startTime + duration + 0.28;
    o1.start(startTime); o2.start(startTime);
    o1.stop(stopT); o2.stop(stopT);
    return [o1, o2];
  }

  /* live sustained note (for keyboard press/hold), returns handle for release */
  function startLiveNote(freq){
    var now = audioCtx.currentTime;
    var o1 = audioCtx.createOscillator(); o1.type = 'sine'; o1.frequency.value = freq;
    var o2 = audioCtx.createOscillator(); o2.type = 'sine'; o2.frequency.value = freq * 2.005;
    var g2 = audioCtx.createGain(); g2.gain.value = 0.13;
    var filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 3600;
    var amp = audioCtx.createGain();
    amp.gain.setValueAtTime(0.0001, now);
    amp.gain.exponentialRampToValueAtTime(0.75 * EP_LEVEL, now + 0.006);
    amp.gain.exponentialRampToValueAtTime(0.32 * EP_LEVEL, now + 0.25);
    o1.connect(filter); o2.connect(g2); g2.connect(filter);
    filter.connect(amp); amp.connect(masterGain);
    o1.start(now); o2.start(now);
    return { o1:o1, o2:o2, amp:amp, freq:freq, startTime:now };
  }
  function stopLiveNote(nodes){
    var now = audioCtx.currentTime;
    var cur = nodes.amp.gain.value || 0.001;
    nodes.amp.gain.cancelScheduledValues(now);
    nodes.amp.gain.setValueAtTime(cur, now);
    nodes.amp.gain.exponentialRampToValueAtTime(0.0001, now + 0.3);
    nodes.o1.stop(now + 0.32); nodes.o2.stop(now + 0.32);
  }

  function soloActive(){ return tracks.some(function(t){ return t.solo; }); }

  /* ============ recording flow ============ */
  function clipPlaybackParams(clip, fromSeconds){
    var clipEnd = clip.offset + clip.duration;
    if (clipEnd <= fromSeconds) return null;
    if (clip.offset >= fromSeconds) return { delay: clip.offset - fromSeconds, bufferOffset: 0 };
    return { delay: 0, bufferOffset: fromSeconds - clip.offset };
  }
  function trackEnd(t){
    var m = 0;
    t.clips.forEach(function(c){ var e = c.offset + c.duration; if (e > m) m = e; });
    return m;
  }
  function sessionContentEnd(){
    var m = 0;
    tracks.forEach(function(t){ var e = trackEnd(t); if (e > m) m = e; });
    return m;
  }

  /* 트랙별 게인 노드 — 재생 중 뮤트/솔로/볼륨을 즉시 반영 */
  var trackGainNodes = {};
  function trackAudible(t){ if (t.muted) return false; if (soloActive() && !t.solo) return false; return true; }
  function applyTrackGains(){
    if (!audioCtx) return;
    tracks.forEach(function(t){
      var g = trackGainNodes[t.id];
      if (g) g.gain.setTargetAtTime(trackAudible(t) ? t.volume : 0, audioCtx.currentTime, 0.015);
    });
  }
  /* fromSeconds(타임라인 위치)를 ctxStart(오디오 시계 시각)에 맞춰 모든 트랙 예약. 반환값 = 가장 늦게 끝나는 지점 */
  function scheduleTracksFrom(fromSeconds, ctxStart){
    trackGainNodes = {};
    var maxEnd = fromSeconds;
    tracks.forEach(function(t){
      if (!t.clips.length) return;
      var g = audioCtx.createGain();
      g.gain.value = trackAudible(t) ? t.volume : 0;
      g.connect(masterGain);
      trackGainNodes[t.id] = g;
      t.clips.forEach(function(c){
        var params = clipPlaybackParams(c, fromSeconds);
        if (!params) return;
        if (c.offset + c.duration > maxEnd) maxEnd = c.offset + c.duration;
        if (t.type === 'audio'){
          var src = audioCtx.createBufferSource(); src.buffer = c.buffer;
          src.connect(g);
          src.start(ctxStart + params.delay, params.bufferOffset);
          activeSources.push(src);
        } else {
          c.notes.forEach(function(n){
            if (n.off <= params.bufferOffset) return;
            var on = n.on - params.bufferOffset, dur = n.off - n.on;
            if (on < 0){ dur += on; on = 0; }
            var nodes = playEP(audioCtx, n.freq, ctxStart + params.delay + on, Math.max(0.05, dur), g, 1);
            activeSources.push.apply(activeSources, nodes);
          });
        }
      });
    });
    return maxEnd;
  }

  /* ---- 지연(레이턴시) 보정 ---- */
  function outputLatencySec(){ if (!audioCtx) return 0; return (audioCtx.baseLatency || 0) + (audioCtx.outputLatency || 0); }
  function inputLatencySec(){
    try { var st = micStream && micStream.getAudioTracks()[0].getSettings(); return (st && typeof st.latency === 'number') ? st.latency : 0; }
    catch(e){ return 0; }
  }

  /* ---- 마이크 PCM 직접 캡처 (MediaRecorder 대체: 샘플 단위 정확 + 무손실) ---- */
  var captureNode = null, captureSink = null, captureChunks = [], captureActive = false, captureReady = null, flushResolver = null;
  var CAPTURE_WORKLET = "class PNCapture extends AudioWorkletProcessor{constructor(){super();this.buf=new Float32Array(4096);this.n=0;this.start=0;" +
    "this.port.onmessage=()=>{if(this.n){this.port.postMessage({frame:this.start,data:this.buf.slice(0,this.n)});this.n=0;}this.port.postMessage({flushed:true});};}" +
    "process(inputs){var ch=inputs[0]&&inputs[0][0];if(ch){if(this.n===0)this.start=currentFrame;this.buf.set(ch,this.n);this.n+=ch.length;" +
    "if(this.n>=3968){this.port.postMessage({frame:this.start,data:this.buf.slice(0,this.n)});this.n=0;}}return true;}}" +
    "registerProcessor('pn-capture',PNCapture);";
  function setupCapture(){
    if (captureReady) return captureReady;
    captureReady = new Promise(function(resolve){
      setupAnalyser();
      captureSink = audioCtx.createGain(); captureSink.gain.value = 0; captureSink.connect(audioCtx.destination);
      function useScriptProcessor(){
        var sp = audioCtx.createScriptProcessor(4096, 1, 1);
        sp.onaudioprocess = function(e){
          if (!captureActive) return;
          var d = e.inputBuffer.getChannelData(0);
          captureChunks.push({ frame: Math.round(e.playbackTime * audioCtx.sampleRate) - d.length, data: new Float32Array(d) });
        };
        micSourceNode.connect(sp); sp.connect(captureSink);
        captureNode = sp; resolve();
      }
      if (audioCtx.audioWorklet && window.AudioWorkletNode){
        var url = URL.createObjectURL(new Blob([CAPTURE_WORKLET], { type:'application/javascript' }));
        audioCtx.audioWorklet.addModule(url).then(function(){
          var node = new AudioWorkletNode(audioCtx, 'pn-capture', { numberOfInputs:1, numberOfOutputs:1, channelCount:1, channelCountMode:'explicit' });
          node.port.onmessage = function(ev){
            if (ev.data.flushed){ if (flushResolver){ var r = flushResolver; flushResolver = null; r(); } return; }
            if (captureActive) captureChunks.push({ frame: ev.data.frame, data: ev.data.data });
          };
          micSourceNode.connect(node); node.connect(captureSink);
          captureNode = node; resolve();
        }).catch(useScriptProcessor);
      } else {
        useScriptProcessor();
      }
    });
    return captureReady;
  }
  function flushCapture(){
    return new Promise(function(resolve){
      if (!captureNode || !captureNode.port){ resolve(); return; }
      flushResolver = resolve;
      captureNode.port.postMessage('flush');
      setTimeout(function(){ if (flushResolver){ flushResolver = null; resolve(); } }, 600);
    });
  }
  function assembleCapturedBuffer(startFrame){
    var endFrame = startFrame;
    captureChunks.forEach(function(c){ var e = c.frame + c.data.length; if (e > endFrame) endFrame = e; });
    var len = endFrame - startFrame;
    if (len <= 0) return null;
    var buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    var out = buf.getChannelData(0);
    captureChunks.forEach(function(c){
      var dst = c.frame - startFrame, src = c.data;
      if (dst < 0){ if (-dst >= src.length) return; src = src.subarray(-dst); dst = 0; }
      if (dst >= len) return;
      if (dst + src.length > len) src = src.subarray(0, len - dst);
      out.set(src, dst);
    });
    return buf;
  }

  /* ---- 화면 꺼짐 방지 (녹음·재생 중) ---- */
  var wakeLockSentinel = null;
  function acquireWakeLock(){
    if (!('wakeLock' in navigator) || wakeLockSentinel) return;
    navigator.wakeLock.request('screen').then(function(sn){
      wakeLockSentinel = sn;
      sn.addEventListener('release', function(){ wakeLockSentinel = null; });
    }).catch(function(){});
  }
  function releaseWakeLock(){
    if (wakeLockSentinel){ try { wakeLockSentinel.release(); } catch(e){} wakeLockSentinel = null; }
  }
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible' && (isRecording || isPlaying || metronomeStandaloneRunning)) acquireWakeLock();
  });

  /* ============ 트랙·클립 모델 ============
     트랙 = { id, type, name, muted, solo, volume, selected, clips:[] }
     클립 = 녹음 한 번 = { id, type, offset(초), duration(초), buffer(오디오) | notes(건반, 클립 시작 기준) }
     클립은 한 번 만들면 바꾸지 않아요(불변) — 자르기·덮어쓰기는 새 클립을 만들어 교체해서, 되돌리기가 가볍고 안전해요. */
  var armedTrackId = null, activeRecordTrackId = null, recordElapsedAtStop = 0;
  var selectedClipId = null, clipIdSeq = 1, typeSeq = { audio:0, midi:0 };
  var undoStack = [];
  function hasContent(){ return tracks.some(function(t){ return t.clips.length > 0; }); }
  function trackById(id){ for (var i = 0; i < tracks.length; i++) if (tracks[i].id === id) return tracks[i]; return null; }
  function findClip(clipId){
    for (var i = 0; i < tracks.length; i++){
      for (var j = 0; j < tracks[i].clips.length; j++){
        if (tracks[i].clips[j].id === clipId) return { track: tracks[i], clip: tracks[i].clips[j] };
      }
    }
    return null;
  }

  /* 안내 토스트 (되돌리기 같은 버튼을 달 수 있음) */
  var toastTimer = null;
  function showToast(msg, actionLabel, actionFn){
    var el = document.getElementById('toast'); if (!el) return;
    el.innerHTML = '';
    var sp = document.createElement('span'); sp.textContent = msg; el.appendChild(sp);
    el.classList.toggle('has-action', !!actionFn);
    if (actionFn){
      var b = document.createElement('button'); b.textContent = actionLabel || '되돌리기';
      b.onclick = function(){ el.classList.remove('show'); actionFn(); };
      el.appendChild(b);
    }
    el.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); toastTimer = null; }, actionFn ? 6000 : 2800);
  }

  /* 되돌리기: 클립 객체는 바뀌지 않으므로 구조만 얕게 복사해 두면 충분함 */
  function snapshotState(){
    return { tracks: tracks.map(function(t){ return Object.assign({}, t, { clips: t.clips.slice() }); }), armedTrackId: armedTrackId };
  }
  function pushUndo(){ undoStack.push(snapshotState()); if (undoStack.length > 20) undoStack.shift(); updateUndoUI(); }
  function updateUndoUI(){ var b = document.getElementById('undoBtn'); if (b) b.disabled = undoStack.length === 0; }
  function undoLast(){
    if (isRecording){ showToast('녹음 중에는 되돌릴 수 없어요'); return; }
    var snap = undoStack.pop();
    if (!snap) return;
    var was = isPlaying;
    if (was) stopAll();
    tracks = snap.tracks; armedTrackId = snap.armedTrackId; selectedClipId = null;
    ensureArmedValid();
    renderTimeline(); updateTransportUI(); updateUndoUI(); saveSessionMeta();
    showToast('되돌렸어요');
    if (was) playAll();
  }

  function typeName(type){ return type === 'audio' ? '오디오' : '미디'; }
  function migrateTrackName(n){ return String(n).replace(/^건반(?=\s|$)/, '미디'); }   // 예전에 저장된 "건반 1" 이름도 "미디 1"로
  function newTrack(type){
    typeSeq[type] = (typeSeq[type] || 0) + 1;
    var t = { id:trackIdSeq++, type:type, name:typeName(type) + ' ' + typeSeq[type], clips:[],
              muted:false, solo:false, volume:1, selected:true };
    // 같은 종류 맨 뒤에 끼워 넣어서 오디오 → 건반 순서를 유지
    var last = -1;
    tracks.forEach(function(x, i){ if (x.type === type) last = i; });
    if (last < 0 && type === 'midi') last = tracks.length - 1;
    tracks.splice(last + 1, 0, t);
    return t;
  }
  function ensureArmedValid(){
    if (trackById(armedTrackId)) return;
    var first = tracks.filter(function(x){ return x.type === 'audio'; })[0] || tracks[0];
    armedTrackId = first ? first.id : null;
  }
  function ensureDefaultSlots(){
    if (tracks.length === 0){ newTrack('audio'); newTrack('audio'); newTrack('midi'); newTrack('midi'); }
    ensureArmedValid();
  }
  function addTrackUI(type){
    if (isRecording){ showToast('녹음 중에는 추가할 수 없어요'); return; }
    pushUndo();
    var t = newTrack(type);
    armedTrackId = t.id;
    renderTimeline(); updateTransportUI(); saveSessionMeta();
    showToast(t.name + ' 추가됨 · 녹음 대상으로 선택했어요');
  }
  function deleteTrack(t){
    if (isRecording){ showToast('녹음 중에는 지울 수 없어요'); return; }
    var was = isPlaying;
    if (was) stopAll();
    pushUndo();
    tracks = tracks.filter(function(x){ return x.id !== t.id; });
    if (selectedClipId != null && !findClip(selectedClipId)) selectedClipId = null;
    ensureArmedValid();
    renderTimeline(); updateTransportUI(); saveSessionMeta();
    showToast(t.name + ' 삭제됨', '되돌리기', undoLast);
    if (was) playAll();
  }
  function deleteClip(clipId){
    if (isRecording){ showToast('녹음 중에는 지울 수 없어요'); return; }
    var f = findClip(clipId); if (!f) return;
    var was = isPlaying;
    if (was) stopAll();
    pushUndo();
    f.track.clips = f.track.clips.filter(function(c){ return c.id !== clipId; });
    selectedClipId = null;
    renderTimeline(); updateTransportUI(); saveSessionMeta();
    showToast(f.track.name + '의 클립을 지웠어요', '되돌리기', undoLast);
    if (was) playAll();
  }

  /* ---- 클립 자르기: 녹음한 구간과 겹치는 부분만 기존 클립에서 잘라냄 ---- */
  function sliceAudioClip(c, a, b){
    var sr = c.buffer.sampleRate;
    var f0 = Math.max(0, Math.round((a - c.offset) * sr));
    var f1 = Math.min(c.buffer.length, Math.round((b - c.offset) * sr));
    var len = f1 - f0;
    if (len < sr * 0.03) return null;
    var nb = audioCtx.createBuffer(c.buffer.numberOfChannels, len, sr);
    for (var ch = 0; ch < nb.numberOfChannels; ch++) nb.getChannelData(ch).set(c.buffer.getChannelData(ch).subarray(f0, f1));
    return { id:clipIdSeq++, type:'audio', offset:c.offset + f0 / sr, duration:nb.duration, buffer:nb };
  }
  function makeMidiClip(absNotes){
    if (!absNotes.length) return null;
    var start = Infinity, end = 0;
    absNotes.forEach(function(n){ if (n.on < start) start = n.on; if (n.off > end) end = n.off; });
    return { id:clipIdSeq++, type:'midi', offset:start, duration:Math.max(0.05, end - start),
             notes: absNotes.map(function(n){ return { freq:n.freq, midi:n.midi, on:n.on - start, off:n.off - start }; }) };
  }
  function cutRange(track, start, end){
    var out = [], hit = false;
    track.clips.forEach(function(c){
      var cs = c.offset, ce = c.offset + c.duration;
      if (ce <= start || cs >= end){ out.push(c); return; }
      hit = true;
      if (track.type === 'audio'){
        if (cs < start - 0.001){ var l = sliceAudioClip(c, cs, start); if (l) out.push(l); }
        if (ce > end + 0.001){ var r = sliceAudioClip(c, end, ce); if (r) out.push(r); }
      } else {
        var left = [], right = [];
        c.notes.forEach(function(n){
          var on = n.on + cs, off = n.off + cs;
          if (on >= end) right.push({ freq:n.freq, midi:n.midi, on:on, off:off });
          else if (on < start) left.push({ freq:n.freq, midi:n.midi, on:on, off:Math.min(off, start) });
          // 녹음 구간 안에서 시작한 기존 노트는 새 녹음으로 대체
        });
        var lc = makeMidiClip(left), rc = makeMidiClip(right);
        if (lc) out.push(lc);
        if (rc) out.push(rc);
      }
    });
    out.sort(function(a, b){ return a.offset - b.offset; });
    track.clips = out;
    return hit;
  }

  function armTrack(id){
    if (isRecording) return;
    var t = trackById(id); if (!t) return;
    armedTrackId = id;
    renderTimeline(); updateTransportUI(); saveSessionMeta();
    showToast('녹음 대상: ' + t.name + (t.clips.length ? '' : ' (비어 있음)'));
  }
  function positionLabel(sec){
    var barDur = beatDuration() * beatsPerBar;
    if (sec < 0.02) return '처음(1마디)';
    return (Math.floor(sec / barDur + 1e-6) + 1) + '마디';
  }

  function startRecording(type){
    initAudio();
    audioCtx.resume();
    // ---- 1) 녹음 대상 결정 ----
    var target = trackById(armedTrackId);
    var how = '';
    if (!target || target.type !== type){
      target = tracks.filter(function(x){ return x.type === type && x.clips.length === 0; })[0];
      if (target){ how = '빈 트랙 자동 선택'; }
      else { target = newTrack(type); how = '새 트랙 생성'; }
    }
    var pos = playheadSeconds, msg;
    if (target.clips.length === 0){
      msg = target.name + ' · ' + positionLabel(pos) + '부터 녹음' + (how ? ' (' + how + ')' : '');
    } else if (pos >= trackEnd(target) - 0.02){
      msg = target.name + ' · ' + positionLabel(pos) + '부터 이어서 녹음 (새 클립으로 붙어요)';
    } else {
      msg = target.name + ' · ' + positionLabel(pos) + '부터 녹음 (겹치는 구간은 덮어써요)';
    }
    armedTrackId = target.id;
    activeRecordTrackId = target.id;

    var proceed = (type === 'audio') ? ensureMic().then(setupCapture) : Promise.resolve();
    proceed.then(function(){
      if (metronomeStandaloneRunning){ metronomeStandaloneRunning = false; stopScheduler(); }
      recordingType = type;
      isRecording = true;
      selectedClipId = null;
      pendingRecordOffset = playheadSeconds;
      liveBuckets = [];
      renderTimeline();
      updateTransportUI();
      acquireWakeLock();
      showToast(msg);

      var bd = beatDuration();
      var countInBeats = countInEnabled ? countInBars * beatsPerBar : 0;
      var scheduleStart = audioCtx.currentTime + 0.15;
      startScheduler(scheduleStart, pendingRecordOffset - countInBeats * bd);
      recordStartCtxTime = scheduleStart + countInBeats * bd;
      startPlayheadLoop(recordStartCtxTime, pendingRecordOffset);

      stopActiveSources();
      scheduleTracksFrom(pendingRecordOffset, recordStartCtxTime);

      if (type === 'audio'){
        captureChunks = [];
        captureActive = true;
        startLiveWave();
      } else {
        tempMidiNotes = [];
        activeNoteOns = {};
      }
    }).catch(function(){
      isRecording = false;
      recordingType = null;
      renderTimeline();
      updateTransportUI();
    });
  }

  /* ---- 녹음 중 대상 트랙 줄에서 실시간으로 그려지는 클립 ---- */
  var recClipEl = null, liveBuckets = [], liveBuf = null;
  function showRecordingLane(){
    hideRecordingLane();
    var lane = document.querySelector('#tlLanes .tl-lane[data-tid="' + activeRecordTrackId + '"]');
    if (!lane) return;
    recClipEl = document.createElement('div');
    recClipEl.className = 'rec-clip';
    recClipEl.style.position = 'absolute';
    recClipEl.style.left = Math.round(pendingRecordOffset * pxPerSec) + 'px';
    recClipEl.appendChild(document.createElement('canvas'));
    lane.appendChild(recClipEl);
    drawRecClip();
  }
  function hideRecordingLane(){
    if (recClipEl && recClipEl.parentNode) recClipEl.parentNode.removeChild(recClipEl);
    recClipEl = null;
  }
  function updateRecordingLane(){
    if (!recClipEl) return;
    var rel = playheadSeconds - pendingRecordOffset;
    if (recordingType === 'audio' && analyser && rel >= 0){
      if (!liveBuf || liveBuf.length !== analyser.fftSize) liveBuf = new Uint8Array(analyser.fftSize);
      analyser.getByteTimeDomainData(liveBuf);
      var pk = 0;
      for (var i = 0; i < liveBuf.length; i++){ var v = Math.abs(liveBuf[i] - 128); if (v > pk) pk = v; }
      var idx = Math.floor(rel / 0.02);
      while (liveBuckets.length <= idx) liveBuckets.push(0);
      if (pk / 128 > liveBuckets[idx]) liveBuckets[idx] = pk / 128;
    }
    drawRecClip();
  }
  function drawRecClip(){
    if (!recClipEl) return;
    var rel = Math.max(0, playheadSeconds - pendingRecordOffset);
    var w = Math.max(6, Math.round(rel * pxPerSec));
    var h = Math.max(8, laneHeightPx() - 10);
    recClipEl.style.width = w + 'px';
    var iw = Math.max(2, w - 3), cv = recClipEl.firstChild, dpr = window.devicePixelRatio || 1;
    var sx = capDpr(iw, dpr);
    cv.width = Math.max(1, Math.round(iw * sx)); cv.height = Math.max(1, Math.round(h * dpr));
    cv.style.width = iw + 'px'; cv.style.height = h + 'px';
    var ctx = cv.getContext('2d');
    ctx.setTransform(sx, 0, 0, dpr, 0, 0);
    if (recordingType === 'audio'){
      ctx.fillStyle = '#3bb4e8';
      var bw = Math.max(1, 0.02 * pxPerSec);
      for (var i = 0; i < liveBuckets.length; i++){
        var b = liveBuckets[i]; if (!b) continue;
        var bh = Math.max(1.5, b * h * 0.95);
        ctx.fillRect(i * 0.02 * pxPerSec, (h - bh) / 2, bw, bh);
      }
    } else {
      var notes = tempMidiNotes.slice();
      Object.keys(activeNoteOns).forEach(function(name){
        var nd = activeNoteOns[name];
        if (nd && nd.recStart != null) notes.push({ midi:nd.midi, on:nd.recStart, off:rel });
      });
      drawNoteRects(ctx, notes, iw, h, '#f5a33b');
    }
  }

  function stopActiveSources(){
    activeSources.forEach(function(s){ try{ s.stop(); }catch(e){} });
    activeSources = [];
    trackGainNodes = {};
  }

  function stopRecording(){
    if (!isRecording) return;
    var type = recordingType;
    var targetId = activeRecordTrackId;
    recordElapsedAtStop = Math.max(0, audioCtx.currentTime - recordStartCtxTime);
    isRecording = false;
    stopScheduler();
    stopActiveSources();
    stopPlayheadLoop();
    hideRecordingLane();
    releaseWakeLock();
    if (type === 'audio'){
      stopLiveWave();
      var offset = pendingRecordOffset;
      // 스피커 출력 지연 + 마이크 입력 지연 + 사용자 보정값만큼 앞부분을 잘라내서 박자에 맞춤
      var latency = outputLatencySec() + inputLatencySec();
      var startFrame = Math.round((recordStartCtxTime + latency) * audioCtx.sampleRate);
      flushCapture().then(function(){
        captureActive = false;
        var buffer = assembleCapturedBuffer(startFrame);
        captureChunks = [];
        if (!buffer || buffer.duration < 0.05) return;
        commitAudioTake(targetId, buffer, offset);
      });
    } else if (type === 'midi'){
      Object.keys(activeNoteOns).forEach(function(name){ releaseKey(name); });
      commitMidiTake(targetId, tempMidiNotes.slice(), pendingRecordOffset, recordElapsedAtStop);
    }
    document.getElementById('status-line').textContent = '대기 중';
    document.getElementById('status-line').className = '';
    renderTimeline();
    updateTransportUI();
  }

  /* 녹음 한 번 = 클립 하나. 겹치는 구간의 기존 클립은 잘라내고(덮어쓰기), 되돌리기로 복구할 수 있음 */
  function commitAudioTake(targetId, take, offset){
    var t = trackById(targetId); if (!t) return;
    pushUndo();
    var cut = cutRange(t, offset, offset + take.duration);
    t.clips.push({ id:clipIdSeq++, type:'audio', offset:offset, duration:take.duration, buffer:take });
    t.clips.sort(function(a, b){ return a.offset - b.offset; });
    finishCommit(cut);
  }
  function commitMidiTake(targetId, notes, offset, elapsed){
    var t = trackById(targetId); if (!t || notes.length === 0) return;   // 아무 음도 안 쳤으면 아무것도 바꾸지 않음
    var abs = notes.map(function(n){ return { freq:n.freq, midi:n.midi, on:n.on + offset, off:n.off + offset }; });
    var clip = makeMidiClip(abs);
    pushUndo();
    var cut = cutRange(t, offset, Math.max(offset + Math.max(elapsed, 0), clip.offset + clip.duration));
    t.clips.push(clip);
    t.clips.sort(function(a, b){ return a.offset - b.offset; });
    finishCommit(cut);
  }
  function finishCommit(cut){
    renderTimeline();
    updateTransportUI();
    clearTimeout(metaSaveTimer);
    syncSessionNow();
    if (cut) showToast('겹치는 구간은 새 녹음으로 덮어썼어요', '되돌리기', undoLast);
  }

  /* ============ playback ============ */
  function playAll(){
    if (!hasContent()) return;
    initAudio(); audioCtx.resume();
    var fromSeconds = playheadSeconds;
    if (fromSeconds >= sessionContentEnd() - 0.05) fromSeconds = 0; // 끝에 있으면 처음부터
    metronomeStandaloneRunning = false;
    stopAll();
    playheadSeconds = fromSeconds;
    var playStart = audioCtx.currentTime + 0.12;
    startScheduler(playStart, fromSeconds);
    var maxEnd = scheduleTracksFrom(fromSeconds, playStart);
    isPlaying = true;
    updateTransportUI();
    acquireWakeLock();
    startPlayheadLoop(playStart, fromSeconds);
    var remaining = Math.max(0.3, maxEnd - fromSeconds);
    playStopTimer = setTimeout(function(){
      playStopTimer = null;
      stopAll();
      playheadSeconds = 0;               // 끝까지 재생하면 처음으로 복귀
      renderPlayheadPosition();
      if (tlScrollEl) tlScrollEl.scrollLeft = 0;
    }, (remaining + 0.3) * 1000);
  }

  function stopAll(){
    stopActiveSources();
    stopScheduler();
    stopPlayheadLoop();
    releaseWakeLock();
    if (playStopTimer){ clearTimeout(playStopTimer); playStopTimer = null; }
    isPlaying = false;
    document.getElementById('status-line').textContent = '대기 중';
    document.getElementById('status-line').className = '';
    updateTransportUI();
  }

  /* ============ tracks state + multitrack timeline ============ */
  var MIN_PX_PER_SEC = 3, MAX_PX_PER_SEC = 400;
  var lastRenderedBars = 0;
  var pxPerSec = 60, userZoomed = false, followPlayhead = true;
  var tlScrollEl = null, playheadRAF = null, playheadRefTime = null;
  var pinchPointers = {}, pinchStartDist = 0, pinchStartPx = 0, pinchAnchorTime = 0, pinchAnchorClientX = 0;
  var pinchPendingPx = null, pinchRAFScheduled = false;

  var DEFAULT_VISIBLE_BARS = 5;
  function defaultPxPerSec(){
    var vw = tlScrollEl ? tlScrollEl.clientWidth : 0;
    if (!vw) vw = Math.max(160, (window.innerWidth || 360) - 24 - 124);   // 아직 레이아웃 전이면 대략값
    var barDur = beatDuration() * beatsPerBar;
    return Math.max(MIN_PX_PER_SEC, Math.min(MAX_PX_PER_SEC, vw / (DEFAULT_VISIBLE_BARS * barDur)));
  }
  /* 사용자가 직접 확대/축소하기 전까지는 BPM·박자·화면 크기가 바뀔 때 5마디 기본 배율을 다시 맞춤 */
  function refreshDefaultZoom(){ if (!userZoomed) pxPerSec = defaultPxPerSec(); }
  function laneHeightPx(){
    return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--lane-h')) || 44;
  }
  function sessionBarCount(){
    var barDur = beatDuration() * beatsPerBar;
    var maxDur = playheadSeconds;
    tracks.forEach(function(t){ var e = trackEnd(t); if (e > maxDur) maxDur = e; });
    var bars = Math.ceil((maxDur + 0.001) / barDur);
    if (bars < 4) bars = 4;
    return bars + 1;
  }
  function sessionDurationSec(){ return sessionBarCount() * beatDuration() * beatsPerBar; }

  function roundRectPath(ctx, x, y, w, h, r){
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawRuler(canvas, widthCss, heightCss, dpr){
    canvas.width = Math.max(1, widthCss * dpr);
    canvas.height = Math.max(1, heightCss * dpr);
    canvas.style.width = widthCss + 'px';
    canvas.style.height = heightCss + 'px';
    var ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, widthCss, heightCss);
    var bd = beatDuration(), barDur = bd * beatsPerBar;
    var barCount = Math.ceil(widthCss / pxPerSec / barDur) + 1;
    ctx.font = "9.5px 'DejaVu Sans Mono', monospace";
    for (var b = 0; b < barCount; b++){
      var x = Math.round(b * barDur * pxPerSec) + 0.5;
      ctx.strokeStyle = 'rgba(255,255,255,0.28)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, heightCss * 0.3); ctx.lineTo(x, heightCss); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.fillText(String(b + 1), x + 3, heightCss - 4);
      ctx.strokeStyle = 'rgba(255,255,255,0.10)';
      for (var beatI = 1; beatI < beatsPerBar; beatI++){
        var bx = Math.round((b * barDur + beatI * bd) * pxPerSec) + 0.5;
        if (bx > widthCss) break;
        ctx.beginPath(); ctx.moveTo(bx, heightCss * 0.6); ctx.lineTo(bx, heightCss); ctx.stroke();
      }
    }
  }

  function capDpr(widthCss, dpr){ return Math.min(dpr, 16000 / Math.max(1, widthCss)); }
  function sizeCanvas(canvas, widthCss, heightCss, dpr){
    var sx = capDpr(widthCss, dpr);
    canvas.width = Math.max(1, Math.round(widthCss * sx));
    canvas.height = Math.max(1, Math.round(heightCss * dpr));
    canvas.style.width = widthCss + 'px';
    canvas.style.height = heightCss + 'px';
    var ctx = canvas.getContext('2d');
    ctx.setTransform(sx, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, widthCss, heightCss);
    return ctx;
  }
  function drawLaneWaveform(canvas, buffer, widthCss, heightCss, dpr){
    var ctx = sizeCanvas(canvas, widthCss, heightCss, dpr);
    var data = buffer.getChannelData(0);
    var step = Math.max(1, Math.ceil(data.length / widthCss));
    ctx.fillStyle = '#3bb4e8';
    for (var x = 0; x < widthCss; x++){
      var min = 1, max = -1, base = x * step;
      for (var i = 0; i < step; i++){
        var idx = base + i;
        if (idx >= data.length) break;
        var v = data[idx];
        if (v < min) min = v;
        if (v > max) max = v;
      }
      var y1 = (1 + min) * 0.5 * heightCss, y2 = (1 + max) * 0.5 * heightCss;
      ctx.fillRect(x, y1, 1, Math.max(1, y2 - y1));
    }
  }
  /* 건반 클립: 피치 위치대로 가는 선(노트)을 찍음. 실시간 녹음 표시와 같은 방식이라 끝나도 모양이 안 튐 */
  function drawNoteRects(ctx, notes, widthCss, heightCss, color){
    if (!notes.length) return;
    var lo = 60, hi = 83;
    notes.forEach(function(n){ if (n.midi < lo) lo = n.midi; if (n.midi > hi) hi = n.midi; });
    var span = Math.max(1, hi - lo), pad = 4, noteH = 3;
    ctx.fillStyle = color;
    notes.forEach(function(n){
      var x = n.on * pxPerSec, ww = Math.max(2, (n.off - n.on) * pxPerSec);
      var y = pad + (hi - n.midi) / span * (heightCss - pad * 2 - noteH);
      roundRectPath(ctx, x, y, ww, noteH, 1.5);
      ctx.fill();
    });
  }
  function drawClipNotes(canvas, clip, widthCss, heightCss, dpr){
    var ctx = sizeCanvas(canvas, widthCss, heightCss, dpr);
    drawNoteRects(ctx, clip.notes, widthCss, heightCss, '#f5a33b');
  }

  var ICON_MIC = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 10v1a7 7 0 0 0 14 0v-1"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>';
  var ICON_KEYS = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"></rect><line x1="8" y1="6" x2="8" y2="14"></line><line x1="12" y1="6" x2="12" y2="14"></line><line x1="16" y1="6" x2="16" y2="14"></line></svg>';

  function refreshClipSelectionUI(){
    var lanes = document.getElementById('tlLanes'); if (!lanes) return;
    Array.prototype.slice.call(lanes.querySelectorAll('.clip-del')).forEach(function(n){ n.parentNode.removeChild(n); });
    Array.prototype.slice.call(lanes.querySelectorAll('.clip.selected')).forEach(function(n){ n.classList.remove('selected'); });
    if (selectedClipId == null) return;
    var el = lanes.querySelector('.clip[data-cid="' + selectedClipId + '"]');
    if (!el){ selectedClipId = null; return; }
    el.classList.add('selected');
    var chip = document.createElement('button');
    chip.className = 'clip-del'; chip.textContent = '✕'; chip.title = '이 클립 삭제';
    chip.style.left = (el.offsetLeft + 5) + 'px';
    chip.onclick = function(ev){ ev.stopPropagation(); deleteClip(selectedClipId); };
    el.parentNode.appendChild(chip);
  }
  function selectClip(id){
    selectedClipId = (selectedClipId === id) ? null : id;
    refreshClipSelectionUI();
  }

  function renderTimeline(){
    var controls = document.getElementById('tlControls');
    var lanesEl = document.getElementById('tlLanes');
    var content = document.getElementById('tlContent');
    var rulerCv = document.getElementById('tlRuler');

    controls.innerHTML = '<div class="tl-ruler-spacer"></div>';
    lanesEl.innerHTML = '';

    var totalSec = sessionDurationSec();
    var viewW = (tlScrollEl && tlScrollEl.clientWidth) || 0;
    var widthPx = Math.max(280, viewW, Math.round(totalSec * pxPerSec));
    content.style.width = widthPx + 'px';
    var dpr = window.devicePixelRatio || 1;
    drawRuler(rulerCv, widthPx, 22, dpr);

    var laneH = laneHeightPx();

    if (tracks.length === 0){
      var hint = document.createElement('div');
      hint.className = 'tl-empty-hint';
      hint.style.width = widthPx + 'px';
      hint.textContent = '트랙이 없어요 · 아래 [＋ 오디오 트랙] [＋ 미디 트랙]으로 추가하세요';
      lanesEl.appendChild(hint);
    }

    tracks.forEach(function(t){
      var armed = (t.id === armedTrackId);
      var hasClips = t.clips.length > 0;
      var hide = hasClips ? '' : ' hidden-ctl';
      var row = document.createElement('div');
      row.className = 'tl-ctrl-row type-' + t.type + (armed ? ' armed' : '') + (armed && isRecording ? ' is-recording' : '') + (hasClips ? '' : ' is-empty');
      row.dataset.tid = t.id;
      row.innerHTML =
        '<div class="tl-row1">' +
          '<input type="checkbox" class="track-select-cb' + hide + '"' + (t.selected !== false ? ' checked' : '') + '>' +
          '<span class="ticon">' + (t.type === 'audio' ? ICON_MIC : ICON_KEYS) + '</span>' +
          '<span class="name">' + t.name + '</span>' +
          '<button class="mini-btn del-btn" title="트랙 삭제">✕</button>' +
        '</div>' +
        '<div class="tl-row2">' +
          '<button class="mini-btn mute-btn' + (t.muted ? ' on' : '') + hide + '">M</button>' +
          '<button class="mini-btn solo-btn' + (t.solo ? ' solo-on' : '') + hide + '">S</button>' +
          '<input type="range" class="vol-slider" min="0" max="1" step="0.01" value="' + t.volume + '">' +
        '</div>';
      controls.appendChild(row);
      row.addEventListener('click', function(e){
        if (e.target.closest('button, input')) return;
        armTrack(t.id);
      });
      row.querySelector('.track-select-cb').onchange = function(e){ t.selected = e.target.checked; saveSessionMeta(); };
      row.querySelector('.mute-btn').onclick = function(){ t.muted = !t.muted; renderTimeline(); applyTrackGains(); saveSessionMeta(); };
      row.querySelector('.solo-btn').onclick = function(){ t.solo = !t.solo; renderTimeline(); applyTrackGains(); saveSessionMeta(); };
      row.querySelector('.del-btn').onclick = function(){ deleteTrack(t); };
      row.querySelector('.vol-slider').oninput = function(e){ t.volume = parseFloat(e.target.value); applyTrackGains(); saveSessionMeta(); };

      var lane = document.createElement('div');
      lane.className = 'tl-lane type-' + t.type + (hasClips ? '' : ' emptylane');
      lane.dataset.tid = t.id;
      lane.style.width = widthPx + 'px';
      lanesEl.appendChild(lane);
      t.clips.forEach(function(c){
        var cw = Math.max(6, Math.round(c.duration * pxPerSec));
        var el = document.createElement('div');
        el.className = 'clip ' + t.type;
        el.dataset.cid = c.id;
        el.style.left = Math.round(c.offset * pxPerSec) + 'px';
        el.style.width = cw + 'px';
        var cv = document.createElement('canvas');
        el.appendChild(cv);
        lane.appendChild(el);
        var iw = Math.max(2, cw - 3), ih = Math.max(8, laneH - 10);
        if (t.type === 'audio') drawLaneWaveform(cv, c.buffer, iw, ih, dpr);
        else drawClipNotes(cv, c, iw, ih, dpr);
      });
    });

    lastRenderedBars = sessionBarCount();
    if (isRecording) showRecordingLane();
    refreshClipSelectionUI();
    renderPlayheadPosition();
  }

  /* ---- zoom (buttons + pinch) ---- */
  function setZoom(newPx, anchorClientX){
    newPx = Math.max(MIN_PX_PER_SEC, Math.min(MAX_PX_PER_SEC, newPx));
    var rect = tlScrollEl.getBoundingClientRect();
    var localX = (anchorClientX != null ? anchorClientX : rect.left + rect.width / 2) - rect.left;
    var timeAtAnchor = (tlScrollEl.scrollLeft + localX) / pxPerSec;
    pxPerSec = newPx;
    userZoomed = true;
    renderTimeline();
    tlScrollEl.scrollLeft = Math.max(0, timeAtAnchor * pxPerSec - localX);
  }

  function tlPointerDown(e){
    pinchPointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    if (Object.keys(pinchPointers).length === 2){
      var pts = Object.keys(pinchPointers).map(function(id){ return pinchPointers[id]; });
      pinchStartDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      pinchStartPx = pxPerSec;
      var midX = (pts[0].x + pts[1].x) / 2;
      var rect = tlScrollEl.getBoundingClientRect();
      pinchAnchorClientX = midX;
      pinchAnchorTime = (tlScrollEl.scrollLeft + (midX - rect.left)) / pxPerSec;
    }
  }
  function tlPointerMove(e){
    if (!(e.pointerId in pinchPointers)) return;
    pinchPointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    var ids = Object.keys(pinchPointers);
    if (ids.length === 2 && pinchStartDist > 0){
      e.preventDefault();
      var pts = ids.map(function(id){ return pinchPointers[id]; });
      var dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      var ratio = dist / pinchStartDist;
      pinchPendingPx = Math.max(MIN_PX_PER_SEC, Math.min(MAX_PX_PER_SEC, pinchStartPx * ratio));
      userZoomed = true;
      if (!pinchRAFScheduled){
        pinchRAFScheduled = true;
        requestAnimationFrame(function(){
          pinchRAFScheduled = false;
          if (pinchPendingPx != null){
            pxPerSec = pinchPendingPx;
            renderTimeline();
            var r2 = tlScrollEl.getBoundingClientRect();
            tlScrollEl.scrollLeft = Math.max(0, pinchAnchorTime * pxPerSec - (pinchAnchorClientX - r2.left));
            pinchPendingPx = null;
          }
        });
      }
    }
  }
  function tlPointerUp(e){
    delete pinchPointers[e.pointerId];
    if (Object.keys(pinchPointers).length < 2) pinchStartDist = 0;
  }

  /* ---- playhead ---- */
  function startPlayheadLoop(refTime, baseSeconds){
    playheadRefTime = refTime;
    playheadBaseSeconds = baseSeconds || 0;
    var ph = document.getElementById('tlPlayhead');
    function tick(){
      if (playheadRefTime == null) return;
      var elapsed = Math.max(0, audioCtx.currentTime - playheadRefTime);
      playheadSeconds = playheadBaseSeconds + elapsed;
      var x = playheadSeconds * pxPerSec;
      ph.style.transform = 'translateX(' + x + 'px)';
      if (isRecording){
        updateRecordingLane();
        // 녹음이 눈금자 끝을 넘어가면 눈금자를 한 마디씩 늘려줌
        var barDurNow = beatDuration() * beatsPerBar;
        if (Math.ceil((playheadSeconds + 0.001) / barDurNow) + 1 > lastRenderedBars) renderTimeline();
      }
      if (followPlayhead){
        var viewW = tlScrollEl.clientWidth;
        if (x - tlScrollEl.scrollLeft > viewW * 0.85 || x < tlScrollEl.scrollLeft){
          tlScrollEl.scrollLeft = Math.max(0, x - viewW * 0.5);
        }
      }
      playheadRAF = requestAnimationFrame(tick);
    }
    tick();
  }
  function stopPlayheadLoop(){
    if (playheadRAF){ cancelAnimationFrame(playheadRAF); playheadRAF = null; }
    playheadRefTime = null;
    renderPlayheadPosition();
  }

  /* ============ WAV encode & export ============ */
  function audioBufferToWav(buffer){
    var numCh = buffer.numberOfChannels;
    var sr = buffer.sampleRate;
    var len = buffer.length * numCh * 2 + 44;
    var bufArr = new ArrayBuffer(len);
    var view = new DataView(bufArr);
    function writeStr(off, s){ for (var i=0;i<s.length;i++) view.setUint8(off+i, s.charCodeAt(i)); }
